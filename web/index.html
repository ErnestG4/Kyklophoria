/* ── dragging a node, in the build view only ──────────────────────────────
 *
 * Pointer events rather than mouse events: the same handlers then work for a
 * finger, and capture means a drag that leaves the canvas keeps going instead
 * of stopping against the edge of the pane — which matters here, because the
 * edge of the pane is where you push a node to put it in a corner.
 *
 * A press that lands on nothing clears the selection, so the inspector is
 * never describing something you stopped touching.
 */
cp.addEventListener('pointerdown', e => {
  const r = cp.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  const b = boxAt(x, y);
  const i = b ? pickNode(b, x, y) : -1;
  selectNode(i);
  place.drag = i;
  place.box = b;
  if (i >= 0) { cp.setPointerCapture(e.pointerId); e.preventDefault(); }
});
cp.addEventListener('pointermove', e => {
  if (place.drag < 0 || !place.box) return;
  const r = cp.getBoundingClientRect();
  moveNodeTo(place.drag, place.box, e.clientX - r.left, e.clientY - r.top);
  renderImport();
});
/* The send is on the drop, not on the move: a world is 6.5 KB and a drag is
   sixty positions a second, and the one that matters is where you let go. */
for (const ev of ['pointerup', 'pointercancel']) cp.addEventListener(ev, () => {
  if (place.drag < 0) return;
  place.drag = -1;
  place.box = null;
  renderImport();
  syncPlacement();
});
$('tabPlay').onclick = () => setView('play');
$('tabBuild').onclick = () => setView('build');
$('tabLib').onclick = () => setView('worlds');

/* How far past the edge the hand is pushing.
 *
 * On a clamped axis, once the centre leaves [0,1] the position stops moving
 * and the sound stops changing, but the knob, the CV and the rotation all keep
 * going. Nothing on the page said so: the dot simply sat against the wall,
 * looking identical whether the request was a hair over the edge or four units
 * past it, and the difference is how long you will be turning the knob back
 * before anything happens again. That is the one thing here that is invisible
 * *and* audible, so it gets a mark.
 *
 * Nothing is drawn for a wrapped axis. A wrap loses no information — the
 * position really is where the fold put it, the dashed seams already say the
 * edge is not an edge, and an excursion arrow there would be reporting an
 * artefact of how the number happens to be written down.
 *
 * The length is logarithmic. Excursions are unbounded — the rotation can carry
 * the centre several units out — so a linear arrow would either be invisible
 * for the small ones that matter most or leave the frame for the large ones.
 * log(1+d) over log 3 saturates at two full units past the edge. */
function drawFold(t, n, ox, oy, S, px, py) {
  if (!t.centre) return;
  const [ax, ay] = axes;
  const wrapped = (a) => {
    if (space && space.topo && a < space.topo.length) return space.topo[a] === 'wrap';
    const c = t.centre[a];
    if (c >= 0 && c <= 1) return foldVote[a] < 0;      /* nothing to learn now */
    const ec = Math.abs(t.posL[a] - clamp01(c));
    const ew = Math.abs(t.posL[a] - (c - Math.floor(c)));
    const lo = Math.min(ec, ew);
    if (lo < 0.02 && Math.abs(ec - ew) > 0.05) {
      foldVote[a] = Math.max(-8, Math.min(8, foldVote[a] + (ec < ew ? 1 : -1)));
    }
    return foldVote[a] < 0;
  };
  const over = (a) => {
    const c = t.centre[a];
    const d = c > 1 ? c - 1 : (c < 0 ? -c : 0);
    return (d < 0.004 || wrapped(a)) ? 0 : (c > 1 ? d : -d);
  };
  const len = d => 5 + 16 * Math.min(1, Math.log(1 + Math.abs(d)) / Math.log(3));
  const tick = (x, y, dx, dy, d) => {
    const L = len(d), ex = x + dx * L, ey = y + dy * L;
    const stroke = (w, c) => {
      cx.lineWidth = w; cx.strokeStyle = c;
      cx.beginPath();
      cx.moveTo(x - dy * 5, y - dx * 5); cx.lineTo(x + dy * 5, y + dx * 5);   /* the wall */
      cx.moveTo(x, y); cx.lineTo(ex, ey);                                      /* the push */
      cx.moveTo(ex, ey); cx.lineTo(ex - dx * 4 - dy * 3, ey - dy * 4 - dx * 3);
      cx.moveTo(ex, ey); cx.lineTo(ex - dx * 4 + dy * 3, ey - dy * 4 + dx * 3);
      cx.stroke();
    };
    stroke(3, 'rgba(7,9,12,0.85)');
    stroke(1.4, '#ff9a5c');
    cx.lineWidth = 1;
  };
  const dx = over(ax), dy = over(ay);
  if (dx) tick(px(dx > 0 ? 1 : 0), py(clamp01(t.posL[ay])), dx > 0 ? 1 : -1, 0, dx);
  if (dy) tick(px(clamp01(t.posL[ax])), py(dy > 0 ? 1 : 0), 0, dy > 0 ? -1 : 1, dy);
  /* Axes off the projection get named rather than drawn: there is no edge on
     screen that belongs to them, and pretending otherwise would put a mark
     somewhere it does not mean anything. */
  let off = '';
  for (let a = 0; a < n; a++) if (a !== ax && a !== ay && over(a)) off += (off ? ',' : '') + a;
  if (off) {
    cx.font = '10px ui-monospace, monospace';
    cx.lineWidth = 3; cx.strokeStyle = 'rgba(7,9,12,0.75)';
    const s2 = 'past the edge on axis ' + off;
    cx.strokeText(s2, ox + 8, oy + S - 26); cx.fillStyle = '#ff9a5c'; cx.fillText(s2, ox + 8, oy + S - 26);
    cx.lineWidth = 1; cx.font = '11px ui-monospace, monospace';
  }
}

/* The orbit, drawn twice over.
 *
 * The faint cross in the main view is already the control frame, and the
 * control frame already has the body's offset added to it — so in that view
 * the body is the cross and the only thing missing is the attractor it is
 * falling toward. When the Kepler plane happens to be the pair of axes on
 * screen, that ring goes straight in.
 *
 * The inset is the honest one and is always drawn. The orbit is a plane in the
 * *unrotated* frame, so once the rotation is doing anything the main view is
 * showing a shadow of it rather than the orbit itself. The inset shows the
 * conic in its own plane where it is a conic.
 *
 * Brightness follows `rush`, which peaks at periapsis, so the orbit is
 * brightest exactly where the timbre is moving fastest. It did not used to.
 * The old ramp swept the hue from 28 to 68 degrees while raising the HSL
 * lightness, and yellow carries so much more luminance than orange that the
 * hue sweep beat the lightness: measured in L* it ran 82.5 at rest, peaked at
 * 91.0 a quarter of the way up, and bottomed out at 76.8 at periapsis. So the
 * body was dimmest exactly where this comment claimed it was brightest, and
 * not even monotone in between. Holding the hue and moving only the lightness
 * gives 56.8 to 84.3, monotone, which is what was meant all along. */
function drawKepler(t, n, ox, oy, S, px, py) {
  const kp = t.kepler;
  if (!kp || !kp.running) return;
  const [ki, kj] = MVL.planeAxes(n, kp.plane);
  /* rush against the range this orbit has actually shown */
  const rspan = rushEnv.hi - rushEnv.lo;
  const rn = rspan > 1e-6 ? Math.min(1, Math.max(0, (kp.rush - rushEnv.lo) / rspan)) : 0.5;
  const hot = `hsl(32,90%,${42 + 36 * rn}%)`;

  if (ki === axes[0] && kj === axes[1]) {
    /* The attractor *is* the control frame. It used to be computed as
       ctl − body, because the firmware added the body into the control frame
       itself; that turned out to be a bug that made ctl diverge to the
       hundreds, and it is fixed — the body is applied to a copy now. */
    const axp = px(clamp01(t.ctl[ki])), ayp = py(clamp01(t.ctl[kj]));
    cx.strokeStyle = 'rgba(255,176,86,0.55)'; cx.lineWidth = 1;
    cx.beginPath(); cx.arc(axp, ayp, 4.5, 0, 7); cx.stroke();
    cx.beginPath(); cx.arc(axp, ayp, 1.2, 0, 7); cx.fillStyle = 'rgba(255,176,86,0.9)'; cx.fill();
  }

  /* inset, bottom-right, autoscaled to the widest excursion we have seen */
  const D = Math.round(Math.min(96, S * 0.30)), bx = ox + S - D - 8, by = oy + 8;
  let rmax = 0.12;
  for (let k = 0; k < kepTrail.n; k++) {
    const x = kepTrail.xy[2 * k], y = kepTrail.xy[2 * k + 1];
    const m = Math.max(Math.abs(x), Math.abs(y)); if (m > rmax) rmax = m;
  }
  if (t.kepXY) for (const [bxp, byp] of t.kepXY) {
    const m = Math.max(Math.abs(bxp), Math.abs(byp)); if (m > rmax) rmax = m;
  }
  const sc = (D * 0.44) / rmax, mx = bx + D / 2, my = by + D / 2;
  cx.fillStyle = 'rgba(12,16,22,0.55)'; cx.fillRect(bx, by, D, D);
  cx.strokeStyle = 'rgba(120,134,150,0.28)'; cx.strokeRect(bx + .5, by + .5, D, D);
  for (let k = 1; k < kepTrail.n; k++) {
    const i0 = (kepTrail.head - kepTrail.n + k - 1 + KEP_N) % KEP_N;
    const i1 = (kepTrail.head - kepTrail.n + k + KEP_N) % KEP_N;
    const x0 = kepTrail.xy[2 * i0], y0 = kepTrail.xy[2 * i0 + 1];
    const x1 = kepTrail.xy[2 * i1], y1 = kepTrail.xy[2 * i1 + 1];
    /* a wrapped orbit jumps the seam; do not draw the chord across it */
    if (Math.abs(x1 - x0) > 0.5 || Math.abs(y1 - y0) > 0.5) continue;
    /* Age fades the segment; rush brightens it. Periapsis is where the orbit
       is moving fastest and so where the fewest samples land, which made it
       the faintest part of the picture — the opposite of what it should be. */
    const rn0 = rspan > 1e-6 ? Math.min(1, Math.max(0, (kepTrail.r[i1] - rushEnv.lo) / rspan)) : 0.5;
    cx.strokeStyle = `rgba(255,176,86,${(0.06 + 0.55 * (k / kepTrail.n)) * (0.35 + 0.65 * rn0)})`;
    cx.beginPath(); cx.moveTo(mx + x0 * sc, my - y0 * sc); cx.lineTo(mx + x1 * sc, my - y1 * sc); cx.stroke();
  }
  cx.strokeStyle = 'rgba(255,176,86,0.5)'; cx.beginPath(); cx.arc(mx, my, 3, 0, 7); cx.stroke();
  /* The company. They pull on body 0 and on each other but the space is not
     read at them, so they are drawn as outlines: present, and clearly not the
     voice. With one body there are none and this loop does nothing. */
  if (t.kepXY && t.kepXY.length) {
    cx.strokeStyle = 'rgba(160,182,210,0.55)'; cx.lineWidth = 1;
    for (const [bxp, byp] of t.kepXY) {
      cx.beginPath(); cx.arc(mx + bxp * sc, my - byp * sc, 2, 0, 7); cx.stroke();
    }
  }
  cx.shadowColor = hot; cx.shadowBlur = 10 + 14 * rn; cx.fillStyle = hot;
  cx.beginPath(); cx.arc(mx + kp.x * sc, my - kp.y * sc, 2.5 + 1.5 * rn, 0, 7); cx.fill(); cx.shadowBlur = 0;
  cx.fillStyle = '#7d8896'; cx.font = '9px ui-monospace, monospace';
  cx.fillText(`kepler ${ki}${kj}` + (t.bodies > 1 ? ` ·${t.bodies}` : ''), bx + 4, by + D - 4);
}
/* One gauge per rotation plane.
 *
 * The angle is shown as a hand rather than as a filled arc. An arc growing
 * from twelve o'clock reads as an accumulating quantity, but the angle is a
 * position on a circle that wraps at one turn, so the arc collapsed to nothing
 * every time round and was ambiguous either side of the seam. A hand has one
 * unmistakable reading at every angle and none at the wrap.
 *
 * The gauges are no longer all the same size. A plane whose radius has
 * collapsed onto the pivot is still turning, and still drew a full-size dial
 * sweeping away, but a rotation about a point you are standing on moves you
 * nowhere: it changes the sound not at all. Sizing each dial by how far the
 * position actually sits from the pivot in that plane makes a busy dial that
 * is doing nothing look like what it is. */
function drawArcs(n, planes, t, x0, y0, S) {
  const gap = Math.min(52, S / planes), rmax = Math.min(9, gap * 0.32);
  for (let p = 0; p < planes; p++) {
    const [a, b] = MVL.planeAxes(n, p), cxp = x0 + gap * (p + 0.5), cyp = y0 + 10;
    const isSpread = t && t.stereo && t.spreadPlane === p;
    /* 0.707 is a corner of the unit square seen from its centre: the furthest
       from the pivot any in-range position can be in one plane. */
    const c = t ? (t.centre || t.posL) : null;
    const rad = c ? Math.min(1, Math.hypot(c[a] - 0.5, c[b] - 0.5) / 0.7071) : 1;
    const r = rmax * (0.45 + 0.55 * rad);
    cx.strokeStyle = '#243040'; cx.lineWidth = 2; cx.beginPath(); cx.arc(cxp, cyp, r, 0, 7); cx.stroke();
    const ang = t ? t.angle[p] : 0;
    const th = -Math.PI / 2 + ang * 2 * Math.PI;
    cx.strokeStyle = '#1d2836'; cx.lineWidth = 1;
    cx.beginPath(); cx.moveTo(cxp, cyp - r); cx.lineTo(cxp, cyp - r - 2.5); cx.stroke();   /* the zero mark */
    cx.strokeStyle = isSpread ? '#ffcc55' : '#62d5ff'; cx.lineWidth = 1.6;
    cx.beginPath(); cx.moveTo(cxp, cyp); cx.lineTo(cxp + Math.cos(th) * r, cyp + Math.sin(th) * r); cx.stroke();
    if (isSpread) { cx.fillStyle = '#ffcc55'; cx.beginPath(); cx.arc(cxp, cyp, 2, 0, 7); cx.fill(); }
    cx.lineWidth = 1; cx.fillStyle = '#74889e'; cx.font = '10px ui-monospace, monospace'; cx.fillText(a + '' + b, cxp - 6, cyp + rmax + 11);
  }
  /* Coupling, to the right of the gauges. The bar is how closed the figure
   * is: near zero the six planes are drifting independently and the path
   * never repeats, near one they have found simple ratios and it does. That
   * is the whole difference between the wash and a shape you can recognise,
   * so it is worth a readout even though it is one number. */
  if (!t || !(t.couple > 0)) return;
  const bx = x0 + gap * planes + 10, bw = Math.max(40, x0 + S - bx - 4), by = y0 + 6;
  cx.fillStyle = '#1a2230'; cx.fillRect(bx, by, bw, 8);
  const L = Math.max(0, Math.min(1, t.lock || 0));
  cx.fillStyle = `hsl(${310 - 30 * L},${45 + 40 * L}%,${40 + 25 * L}%)`;
  cx.fillRect(bx, by, bw * L, 8);
  cx.fillStyle = '#74889e'; cx.font = '10px ui-monospace, monospace';
  cx.fillText(`lock ${L.toFixed(2)}  couple ${t.couple.toFixed(2)}`, bx, by + 20);
  /* The last two seconds of it. Deliberately no p:q label: the ratio the
     planes have found is not on the wire, and a number recovered here by
     guessing at a rational close to the angle ratio would be stated with a
     confidence nothing supports. The shape says settling, sliding or hunting
     without having to name the tongue. */
  if (lockHist.n > 3) {
    const sw = 60, sh = 10, sx = Math.min(bx + bw - sw, x0 + S - sw - 2), sy = by + 13;
    cx.fillStyle = 'rgba(12,16,22,0.6)'; cx.fillRect(sx, sy, sw, sh);
    cx.strokeStyle = '#2c3a4a'; cx.lineWidth = 1; cx.beginPath();
    for (let k = 0; k < lockHist.n; k++) {
      const idx = (lockHist.head - lockHist.n + k + LOCK_N) % LOCK_N;
      const vx = sx + sw * (k / (LOCK_N - 1)), vy = sy + sh - sh * Math.max(0, Math.min(1, lockHist.v[idx]));
      k ? cx.lineTo(vx, vy) : cx.moveTo(vx, vy);
    }
    cx.strokeStyle = `hsl(${310 - 30 * L},${45 + 40 * L}%,${55 + 20 * L}%)`; cx.stroke();
  }
}

/* How wide the two voices really are.
 *
 * The dots and the line between them show the separation *as projected*, which
 * is zero whenever the spread plane is not the plane being drawn — the two
 * voices sit exactly on top of each other and the picture says mono while the
 * ears say otherwise. The geometry is knowable regardless: L and R are the
 * centre turned by minus and plus the spread in one plane, so they are two
 * points on a circle about the pivot separated by twice the spread, and the
 * chord between them is 2·r·sin(2·pi·delta).
 *
 * Geometry is not the whole of it either. The same chord across a flat part of
 * a world is two voices that sound alike, and across a steep part it is two
 * different instruments. So the difference in their spectral centroids is
 * shown next to it, when the world is a formula the page can evaluate at both
 * points; a tabulated world only ships the left voice's spectrum, and that
 * half of the readout is left off rather than filled with the left one twice. */
const wscratch = { p: new Float32Array(6), spec: new Float32Array(256) };
function stereoWidth(t) {
  if (!t || !t.stereo) return null;
  const [i, j] = MVL.planeAxes(t.n, t.spreadPlane);
  const c = t.centre || t.posL;
  const rad = Math.hypot(c[i] - 0.5, c[j] - 0.5);
  const geo = Math.abs(2 * rad * Math.sin(2 * Math.PI * t.spread));
  const onScreen = (i === axes[0] && j === axes[1]) || (i === axes[1] && j === axes[0]);
  let tim = null;
  const nl = evaluatorFor(basis);
  if (nl && basis) {
    const at = (pos) => {
      for (let a = 0; a < basis.n && a < 6; a++) wscratch.p[a] = clamp01(pos[a]);
      return shadeMeasure(nl(basis, wscratch.p, wscratch.spec, t.sharp || 0), basis.k, 0);
    };
    tim = Math.abs(at(t.posL) - at(t.posR));
  }
  return { geo, tim, onScreen };
}
function drawSound() {
  const { w: W, h: H } = boxOf(cn);
  fit(cn);
  const m = 14, font = '11px ui-monospace, monospace';
  /* The spectrum used to take everything below the payload lanes, which was
     far more room than 64 bars need and left nowhere to say what the panel is
     doing. It keeps a fixed slice now and the panel mirror takes the rest. */
  const panelH = panel ? Math.min(170, Math.max(110, H * 0.32)) : 0;
  const frameTop = 26, frameH = Math.max(40, H * 0.30), mid = frameTop + frameH / 2;
  const stripY = frameTop + frameH + 10;                       /* payload lanes row */
  const specCap = stripY + 34;                                  /* "spectrum" caption baseline */
  const specTop = specCap + 8, base = H - m - 12 - panelH, h = Math.max(20, base - specTop);
  cnx.font = font;
  cnx.strokeStyle = '#141b23'; cnx.beginPath(); cnx.moveTo(m, mid); cnx.lineTo(W - m, mid); cnx.stroke();
  cnx.fillStyle = '#6b819d';
  cnx.fillText('frame', m, 18); cnx.fillText('spectrum', m, specCap);
  if (!tel) return;
  /* Untinted on purpose. The frame, the lanes and the spectrum bars all took
     the same hue as the dot, which spent the page's one colour channel saying
     one thing in four places. Colour now means position-in-timbre and appears
     only in the space view. */
  /* frame: 256 points, i8/127, ×40 scale means ±3.2 full scale */
  if (tel.frame) {
    cnx.strokeStyle = '#62d5ff'; cnx.lineWidth = 1.5; cnx.beginPath();
    for (let i = 0; i < 256; i++) { const x = m + (W - 2 * m) * i / 255, y = mid - (tel.frame[i] / 127) * (frameH / 2 - 6); i ? cnx.lineTo(x, y) : cnx.moveTo(x, y); }
    cnx.stroke(); cnx.lineWidth = 1;
  }
  /* payload lanes: one row of meters between frame and spectrum */
  const P = tel.p, mw = (W - 2 * m) / Math.max(1, P);
  for (let j = 0; j < P; j++) {
    const x = m + j * mw + 2, w = Math.max(8, mw - 6);
    cnx.fillStyle = '#6b819d'; cnx.fillText('pl' + j, x, stripY + 10);
    cnx.fillStyle = '#1a2230'; cnx.fillRect(x, stripY + 14, w, 6);
    cnx.fillStyle = '#3f7f9c'; cnx.fillRect(x, stripY + 14, w * clamp01(tel.payload[j]), 6);
  }
  if (panelH) drawPanel(m, H - m - panelH + 6, W - 2 * m, panelH - 6);
  /* spectrum: K bars on a +6…−96 dB scale, cutoff marked on the bottom axis */
  if (tel.mags) {
    const k = tel.k, x0 = m, bw = (W - 2 * m) / k;
    cnx.fillStyle = '#6b819d'; cnx.fillText('+6 dB', W - m - 36, specCap); cnx.fillText('−96', W - m - 24, base - 2);
    for (let i = 0; i < k; i++) {
      const v = tel.mags[i] / 255, live = i < tel.kcut;
      cnx.fillStyle = live ? `rgba(98,213,255,${0.35 + 0.65 * v})` : 'rgba(93,104,115,0.35)';
      cnx.fillRect(x0 + i * bw + 0.5, base - v * h, Math.max(1, bw - 1.5), v * h);
    }
    const kx = x0 + tel.kcut * bw, label = 'nyq ' + tel.kcut, lw = cnx.measureText(label).width;
    cnx.strokeStyle = '#ffcc55'; cnx.setLineDash([2, 3]); cnx.beginPath(); cnx.moveTo(kx, specTop); cnx.lineTo(kx, base + 4); cnx.stroke(); cnx.setLineDash([]);
    cnx.fillStyle = '#6b819d'; cnx.fillText('1', x0, base + 12);
    const kTick = String(k), kTickX = W - m - cnx.measureText(kTick).width;
    /* the cutoff label sits on the bottom axis beside its marker; it steps left of the marker when it would run into the K tick */
    const lx = (kx + 4 + lw > kTickX - 8) ? kx - lw - 4 : kx + 4;
    cnx.fillStyle = '#ffcc55'; cnx.fillText(label, Math.max(x0 + 12, lx), base + 12);
    if (tel.kcut < k) { cnx.fillStyle = '#6b819d'; cnx.fillText(kTick, kTickX, base + 12); }   /* the cutoff label already names K when nothing is cut */
  }
}
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const fmtVec = v => Array.from(v).map(x => x.toFixed(2)).join(' ');
/* The six knobs under the player's hands, right now.
 *
 * Which page the panel is on comes from telemetry; what the six knobs of that
 * page are comes from the descriptor. Neither alone is enough — the descriptor
 * describes all six pages and cannot say which one you are holding, and the
 * page index alone is a number with no meaning. */
function drawPanel(x0, y0, W, H) {
  if (!panel || !panel.pots) return;
  const pg = tel && tel.page < panel.pages ? tel.page : 0;
  const name = panel.names[pg] || ('page ' + pg);
  const tint = panel.colors && panel.colors[pg] ? panel.colors[pg] : '#62d5ff';
  cnx.strokeStyle = '#141b23'; cnx.beginPath();
  cnx.moveTo(x0, y0 - 8); cnx.lineTo(x0 + W, y0 - 8); cnx.stroke();
  cnx.font = '11px ui-monospace, monospace';
  cnx.fillStyle = '#6b819d'; cnx.fillText('PANEL', x0, y0 + 6);
  cnx.fillStyle = tint;      cnx.fillText(name, x0 + 48, y0 + 6);
  /* Pages other than the live one are named but not spelled out — the point is
     what is under your hands, not a manual. */
  cnx.fillStyle = '#637a93'; cnx.font = '10px ui-monospace, monospace';
  let tx = x0 + 48 + cnx.measureText(name).width * 1.1 + 14;
  for (let i = 0; i < panel.pages; i++) {
    if (i === pg) continue;
    const t = panel.names[i] || String(i);
    if (tx + 40 > x0 + W) break;
    cnx.fillText(t, tx, y0 + 6); tx += cnx.measureText(t).width + 10;
  }
  /* A knob, drawn as a knob.
   *
   * A bar answered "how far up" but not "which way is up": a panel knob sweeps
   * about 270 degrees from lower-left to lower-right, and a horizontal bar made
   * you translate. The arc is the same shape as the thing under your hand.
   *
   * The descriptor's `disp` hint says what sort of control it is — `snap` is a
   * selector, so it gets detent ticks and its pointer lands on one. */
  /* Two columns of three, because that is what the panel is.
   *
   * From ../alchemy-sdk/hardware/alchemy-lab/v2/include/alchemy/hw/
   * alchemy_lab_v2_layout.h, which is the source of truth for the panel:
   *
   *      [P1] B1 [P2]
   *      [P3] B2 [P4]
   *      [P5] B3 [P6]
   *
   * odd-numbered pots down the left, even down the right. This mirror laid them
   * out three across and two down, so it put P1 P2 P3 in a row when P3 is
   * physically *below* P1 — every knob after the second was in the wrong place,
   * which is the whole point of a mirror getting wrong. Reported from the bench
   * as "the pot numbers are out of line in the diagram".
   *
   * Hardcoded rather than read from the descriptor, because the descriptor
   * carries what each knob *does* and not where it is. If a board ever has a
   * different arrangement this is the line that has to learn about it. */
  const cols = panel.pots <= 3 ? 1 : 2, rows = Math.ceil(panel.pots / cols);
  const cw = W / cols, ch = Math.max(34, (H - 18) / rows);
  const A0 = Math.PI * 0.75, A1 = Math.PI * 2.25;
  for (let i = 0; i < panel.pots; i++) {
    const k = panel.grid[pg] && panel.grid[pg][i];
    const cx0 = x0 + (i % cols) * cw, cy0 = y0 + 18 + Math.floor(i / cols) * ch;
    const r = Math.min(11, ch * 0.34);
    const kx = cx0 + r + 2, ky = cy0 + r + 1;
    cnx.lineWidth = 2.5; cnx.lineCap = 'butt';
    cnx.strokeStyle = '#1a2230';
    cnx.beginPath(); cnx.arc(kx, ky, r, A0, A1); cnx.stroke();
    if (k && tel && (tel.pots || tel.knobs)) {
      /* Two numbers, and they are different numbers.
       *
       * The panel catches rather than jumps: arriving on a page leaves each
       * pot wherever your hand left it while the parameter keeps the value it
       * had, and turning the pot through that value is what picks it up. The
       * mirror drew the pot, which is the one thing on screen that is not what
       * the instrument is doing — on any page you have just arrived on it was
       * showing six numbers that were not in effect.
       *
       * So the value is the knob: the filled arc and the pointer, drawn in the
       * page's own colour. The pot is a tick outside the ring, dimmer. When
       * they agree it sits under the pointer and reads as one mark; when they
       * do not, the gap between them is exactly how far you have to turn
       * before the knob takes hold, which is a thing worth being able to see.
       *
       * Older firmware sends no values, and then the pot is all there is —
       * which is the old behaviour, and honest, because it is all the module
       * said. */
      const snap = k.disp && k.disp.kind === 'snap';
      const n = snap ? Math.max(2, k.disp.count || 0) : 0;
      const detent = (x) => (snap && n > 1 ? Math.round(x * (n - 1)) / (n - 1) : x);
      const pot = tel.pots ? Math.max(0, Math.min(1, tel.pots[i] || 0)) : null;
      const val = tel.knobs ? Math.max(0, Math.min(1, tel.knobs[i] || 0)) : null;
      const v = val != null ? val : pot;
      const u = detent(v);
      const th = A0 + (A1 - A0) * u;
      cnx.strokeStyle = tint;
      cnx.beginPath(); cnx.arc(kx, ky, r, A0, Math.max(A0 + 0.001, th)); cnx.stroke();
      cnx.lineWidth = 1.5;
      cnx.beginPath();
      cnx.moveTo(kx + Math.cos(th) * (r - 5), ky + Math.sin(th) * (r - 5));
      cnx.lineTo(kx + Math.cos(th) * (r + 1), ky + Math.sin(th) * (r + 1));
      cnx.stroke();
      /* Where the hand is, when that is not where the value is. */
      if (val != null && pot != null) {
        const pt = A0 + (A1 - A0) * detent(pot);
        const caught = Math.abs(pot - val) < 0.02;
        cnx.strokeStyle = caught ? tint : '#8b9bab';
        cnx.lineWidth = caught ? 1 : 1.5;
        cnx.beginPath();
        cnx.moveTo(kx + Math.cos(pt) * (r + 3), ky + Math.sin(pt) * (r + 3));
        cnx.lineTo(kx + Math.cos(pt) * (r + 6), ky + Math.sin(pt) * (r + 6));
        cnx.stroke();
      }
      cnx.lineWidth = 1.5;
      if (snap) {
        cnx.strokeStyle = '#2f3a46'; cnx.lineWidth = 1;
        for (let d = 0; d < n; d++) {
          const dt = A0 + (A1 - A0) * (d / (n - 1));
          cnx.beginPath();
          cnx.moveTo(kx + Math.cos(dt) * (r + 2), ky + Math.sin(dt) * (r + 2));
          cnx.lineTo(kx + Math.cos(dt) * (r + 4), ky + Math.sin(dt) * (r + 4));
          cnx.stroke();
        }
      }
    }
    cnx.lineWidth = 1;
    cnx.fillStyle = '#6b819d'; cnx.font = '9px ui-monospace, monospace';
    /* Over the knob it belongs to. It used to sit at the cell's left edge,
       which with the name drawn to the knob's right put each number nearer the
       previous knob's label than its own. */
    cnx.fillText('P' + (i + 1), kx - r, cy0 + 8);
    cnx.fillStyle = k ? '#9aa7b3' : '#607a97'; cnx.font = '10px ui-monospace, monospace';
    const label = k ? k.name : '—';
    let txt = label; const avail = cw - (2 * r + 10);
    while (txt.length > 3 && cnx.measureText(txt).width > avail) txt = txt.slice(0, -1);
    cnx.fillText(txt + (txt !== label ? '…' : ''), cx0 + 2 * r + 6, cy0 + r + 5);
  }
}

/* Writing textContent that is already there still dirties layout, and the
   canvas draws measure right afterwards. Only write on change. */
const lastText = new Map();
function setText(id, v) {
  if (lastText.get(id) === v) return;
  lastText.set(id, v);
  $(id).textContent = v;
}
function drawStatus() {
  if (!tel) return;
  setText('sBlock', String(tel.block));
  setText('sF0', tel.f0.toFixed(1) + ' Hz ' + MVL.noteName(tel.f0));
  setText('sKcut', tel.kcut + '/' + tel.k);
  if (tel.mute !== lastMute) { lastMute = tel.mute; renderMuteChips(); }
  /* What the Morph knob is actually doing. A knob whose effect is invisible is
     a knob nobody trusts, and this one does nothing at all unless a target is
     set — which is worth saying rather than leaving to be discovered. */
  {
    const mw = tel.morphWorld;
    const named = mw !== 0xFF && worlds && worlds.list[mw] ? worlds.list[mw].name : null;
    setText('morphState', mw === 0xFF ? 'no target — the knob does nothing'
            : `${(tel.morph * 100).toFixed(0)}% towards ${named || ('world ' + mw)}`
              + (tel.aimed ? ', read at its nearest match' : ''));
    const aimOn = !!tel.aimed;
    if (aimOn !== lastAimed) {
      lastAimed = aimOn;
      $('morphAim').className = 'chip' + (aimOn ? ' on' : '');
      $('morphDirect').className = 'chip' + (aimOn ? '' : ' on');
    }
    $('morphAim').disabled = $('morphDirect').disabled = !link || mw === 0xFF;
    /* keep the dropdown honest if the target was set from somewhere else */
    const sel = $('morphSel');
    if (sel && !sel.disabled && String(mw) !== sel.value && document.activeElement !== sel)
      sel.value = String(mw);
  }
  const sw = stereoWidth(tel);
  setText('sSpread', !sw ? 'mono'
    : `${tel.spread.toFixed(3)} turns · plane ${MVL.planeAxes(tel.n, tel.spreadPlane).join('')}`
      + ` · width ${sw.geo.toFixed(3)}` + (sw.tim === null ? '' : ` · timbre ${sw.tim.toFixed(3)}`)
      + (sw.onScreen ? '' : ' · off this plane'));
  if (link) { const s = link.stats; setText('sLink', `${s.rttAvg.toFixed(1)} ms · ${fpsWin.fps.toFixed(0)} fps · ${s.kbps.toFixed(1)} KB/s${s.timeouts ? ' · ' + s.timeouts + ' timeouts' : ''}`); }
  if (stats) {
    const pct = v => stats.cyclesBudget ? (100 * v / stats.cyclesBudget).toFixed(0) + '%' : v;
    setText('sCpu', `${pct(stats.cyclesLast)} last · ${pct(stats.cyclesAvg)} avg · ${pct(stats.cyclesMax)} max · div ${stats.renderDiv}${stats.overruns ? ' · ' + stats.overruns + ' overruns' : ''}${stats.dropped ? ' · ' + stats.dropped + ' dropped' : ''}`);
    $('sCpuWrap').classList.toggle('warn', stats.overruns > 0 || (stats.cyclesBudget && stats.cyclesMax > 0.7 * stats.cyclesBudget));
  }
}
/* The draw loop reschedules itself whatever happens.
 *
 * It used to call requestAnimationFrame *after* the three draws, so a single
 * throw in any of them stopped the loop for good: the last good frame stayed
 * painted, nothing ever updated again, and because click handlers run on their
 * own stack the page went on sending commands to the module quite happily. It
 * looked like a hung link rather than a dead renderer, which is the worst way
 * for it to fail. A drawing bug should cost one frame, not the session.
 *
 * The message is reported once per distinct error so a fault that repeats
 * sixty times a second does not bury everything else in the status line. */
let lastDrawError = '';
function frame() {
  try {
    if (viewMode === 'build') { drawPlane(); drawInspect(); }
    else { drawSpace(); drawSound(); }
    drawStatus();
  }
  catch (e) {
    const m = (e && e.message) || String(e);
    if (m !== lastDrawError) { lastDrawError = m; say('draw: ' + m, true); console.error(e); }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ── dev drawer (bridge only): 0x6E SET_CONTROL at ≤ 30 Hz ─────────── */
const ctl = { f0: 110, c: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5], ang: new Array(15).fill(0), spread: 0 };
let sendPending = false, lastSend = 0;
function sendControl() {
  if (!link || link.kind !== 'bridge') return;
  const now = performance.now();
  if (now - lastSend < 33) { if (!sendPending) { sendPending = true; setTimeout(() => { sendPending = false; sendControl(); }, 33 - (now - lastSend)); } return; }
  lastSend = now;
  const n = tel ? tel.n : 4, planes = MVL.planeCount(n);
  link.request(MVL.CMD.setControl, MVL.setControlReq(ctl.f0, ctl.c.slice(0, n), ctl.ang.slice(0, planes), ctl.spread), { urgent: true, key: 'ctl' }).catch(e => say('control: ' + e.message, true));
}
function buildDrawer() {
  const d = $('drawer'); d.innerHTML = '';
  const n = tel ? tel.n : (space ? space.n : 4), planes = MVL.planeCount(n);
  if (tel) { ctl.f0 = tel.f0; for (let a = 0; a < n; a++) ctl.c[a] = tel.ctl[a]; for (let p = 0; p < planes; p++) ctl.ang[p] = tel.angle[p]; ctl.spread = tel.spread; }
  const row = (name, min, max, step, get, set, fmt) => {
    const l = document.createElement('label'); const s = document.createElement('span'); s.textContent = name;
    const i = document.createElement('input'); i.type = 'range'; i.min = min; i.max = max; i.step = step; i.value = get();
    const o = document.createElement('output'); o.textContent = fmt(get());
    i.oninput = () => { set(parseFloat(i.value)); o.textContent = fmt(get()); sendControl(); };
    l.append(s, i, o); d.appendChild(l);
  };
  const h = t => { const e = document.createElement('h4'); e.textContent = t; d.appendChild(e); };
  h('PITCH · POSITION');
  row('f0', Math.log2(20), Math.log2(2000), 0.001, () => Math.log2(ctl.f0), v => ctl.f0 = Math.pow(2, v), () => ctl.f0.toFixed(1) + ' Hz');
  for (let a = 0; a < n; a++) row('axis ' + a, -0.2, 1.2, 0.001, () => ctl.c[a], v => ctl.c[a] = v, v => v.toFixed(3));
  h('ROTATION (turns)');
  for (let p = 0; p < planes; p++) { const [x, y] = MVL.planeAxes(n, p); row('plane ' + x + y, 0, 1, 0.001, () => ctl.ang[p], v => ctl.ang[p] = v, v => v.toFixed(3)); }
  h('STEREO');
  row('spread', 0, 0.12, 0.0005, () => ctl.spread, v => ctl.spread = v, v => v.toFixed(4));
  d.classList.add('show'); resize();
}

/* auto-connect to the bridge when served from it */
/* Auto-connect to the bridge when the page came from it — unless ?serial is
 * in the URL, which keeps the link free for the module (the Serial button is
 * hidden while any transport is connected). */
if (!/[?&]serial\b/.test(location.search)
    && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)
    && location.protocol.startsWith('http')) connectBridge(false);
if (!navigator.serial) $('btnSerial').title = 'Web Serial: Chrome/Edge desktop only';
})();
