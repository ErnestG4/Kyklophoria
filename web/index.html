<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyklophoria</title>
<style>
  /* Contrast, measured against --bg rather than eyeballed. Small text wants
     4.5:1 to be readable and 7:1 to be comfortable, and most of this page's
     text is 10 to 12 px. --dim was #5d6873, which is 3.51:1 — under the
     readable floor — and it carries the world bar, the footer, the build row
     and every state line on the page. The canvas had worse: captions 3.64,
     the card fit text 2.76, the empty-state hints 2.11. All lifted in place,
     hue and saturation kept, so the hierarchy still reads as a hierarchy. */
  :root { --bg: #07090c; --ink: #cfd6dd; --dim: #8b9bab; --line: #1a2028; --hot: #ffcc55; --l: #62d5ff; --r: #ff7a9e; --ok: #6ee7a0; --bad: #ff5c5c;
          --dim2: #77889e;   /* one step down: the fit on a card, 5.5:1 */
          --hint: #6b819d; } /* quietest text that is still an instruction, 5.0:1 */
  * { box-sizing: border-box; }
  /* `hidden` has to beat our own layout rules, and by default it does not.
     The browser's stylesheet says [hidden] { display: none }, which is an
     attribute selector and loses to any rule with an id in it — and the three
     things this page hides (#playMain, #buildMain, #worldbar) all set display
     from an id. Without this the build view and the instrument render on top
     of each other and the tabs do nothing, which no amount of testing against
     a stub canvas would ever notice. */
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.35 ui-monospace, "SF Mono", Menlo, Consolas, monospace; height: 100%; overflow: hidden; }
  body { display: grid; grid-template-rows: auto auto 1fr auto auto; height: 100vh; }
  header { display: flex; align-items: center; gap: 12px; padding: 6px 12px; border-bottom: 1px solid var(--line); }
  header .name { font-weight: 600; letter-spacing: .08em; color: var(--hot); }
  header .sp { flex: 1; }
  /* Two jobs, two views. Playing is a readout of the module; building a world
     is an editor for something the module is not holding yet. They were one
     view, and the placement rings ended up sitting on top of a live position
     readout, which is the picture telling you two unrelated things in the same
     marks. */
  .tab { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--dim);
         font: inherit; letter-spacing: .1em; padding: 2px 6px 1px; cursor: pointer; }
  .tab:hover { color: var(--ink); }
  .tab.on { color: var(--hot); border-bottom-color: var(--hot); }
  button { background: #0f141a; color: var(--ink); border: 1px solid #263039; border-radius: 3px; padding: 3px 9px; font: inherit; cursor: pointer; }
  button:hover { border-color: #3a4855; } button.on { border-color: var(--hot); color: var(--hot); }
  button:disabled { opacity: .4; cursor: default; }
  /* world strip: which space the module is indexing, and how the terrain is shaded */
  /* Two rows, not one wrapping row. With nine worlds the chips fitted beside
     the description and it read fine; at eighteen they wrap, and a single flex
     row wraps the description in among them — names and notes jumbled
     together. The list only grows, so the chips get a line of their own. */
  #worldbar { display: flex; flex-direction: column; gap: 3px; padding: 4px 12px;
              border-bottom: 1px solid var(--line); font-size: 11px; color: var(--dim); }
  #worldbar .wrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 20px; }
  #worldbar .cap { letter-spacing: .1em; flex: none; }
  #worldbar .sp { flex: 1; }
  #worldChips, #shadeChips { display: flex; gap: 6px; flex-wrap: wrap; }
  /* A row of its own, and allowed to wrap.
     
     It was one line, clipped with an ellipsis, sharing a row with the shade
     and tail chips — which was right when a note was "one line, for the
     page's list" and six words long. The notes now say what each of the four
     axes does and give the formula where there is one, because a world is a
     space you steer by hand and this is the only place that can tell you what
     you are steering. Clipping that at forty characters would be keeping the
     cost and throwing away the point. */
  #worldNote { flex: 1 1 100%; min-width: 0; white-space: normal; line-height: 1.4;
               font-style: italic; }
  #worldNote.peek { color: var(--ink); font-style: normal; }
  .chip { background: #0f141a; color: var(--dim); border: 1px solid #263039; border-radius: 3px;
          padding: 1px 8px; font: inherit; cursor: pointer; white-space: nowrap; }
  .chip:hover { border-color: #3a4855; color: var(--ink); }
  .chip.on { border-color: var(--hot); color: var(--hot); }
  .chip.analytic::after { content: " ƒ"; opacity: .75; }   /* has a formula */
  .chip:disabled { opacity: .45; cursor: default; }
  /* A select rather than a chip row: twenty-two worlds and an open-ended list
     of files are both too many to lay out flat, and a dropdown is the honest
     control for a long list. */
  #worldbar select { background: #0f141a; color: var(--ink); border: 1px solid #263039;
                     border-radius: 3px; padding: 1px 4px; font: inherit; max-width: 180px; }
  #worldbar input[type=text] { background: #0f141a; color: var(--ink); border: 1px solid #263039;
                     border-radius: 3px; padding: 1px 4px; font: inherit; width: 9em; }
  #worldbar input[type=text]:focus { outline: none; border-color: var(--hot); }
  #worldbar input[type=text]::placeholder { color: var(--dim); opacity: .7; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 34%); gap: 0; min-height: 0; }
  /* Both views occupy the same row; whichever is not hidden fills it. */
  /* Every row placed explicitly, so auto-placement has nothing to decide.
     The play view fills row 2 with the world bar, but the build and worlds tabs
     hide it — and with row 2 free, sparse auto-placement is entitled to put the
     footer there, between the header and the pane. Pinning all of them costs
     two declarations and removes the question. */
  header { grid-row: 1; }
  nav#worldbar { grid-row: 2; }
  main, #buildMain, #libMain { grid-row: 3; }
  #drawer { grid-row: 4; }
  footer { grid-row: 5; }
  #libMain { display: grid; grid-template-rows: auto auto minmax(0, 1fr); min-height: 0; }
  /* The loop's stops, in the order the clock walks them. A chip rather than a
     tile: this is a sequence and reads left to right, where the grid below is a
     library and reads as a field. */
  #tourStops { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  #tourStops .ts { border: 1px solid #263039; border-radius: 3px; background: #0f141a;
                   padding: 1px 5px; font-size: 10px; color: var(--dim); white-space: nowrap; }
  #tourStops .ts.live { border-color: var(--ok); color: var(--ok); }
  #tourStops .ts.next { border-color: var(--l); color: var(--ink); }
  #tourStops .ar { color: #3a4855; font-size: 10px; }
  /* The slots. A grid rather than a list because thirty-two of them is a shape
     you scan, not a thing you read top to bottom. */
  #slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
           gap: 6px; padding: 8px 10px; overflow: auto; align-content: start; }
  .slot { border: 1px solid #263039; border-radius: 3px; background: #0f141a;
          padding: 4px 6px 5px; cursor: pointer; min-width: 0; }
  .slot:hover { border-color: #3a4855; }
  .slot.on { border-color: var(--hot); }
  /* Dashed for empty, because an empty slot is a place to put something rather
     than a thing — and it is also a drop target, which dashed already says. */
  .slot.empty { border-style: dashed; color: var(--dim); }
  .slot.drop { border-color: var(--l); border-style: solid; }
  .slot .sn { font-size: 9px; color: var(--dim); letter-spacing: .08em; }
  .slot .snm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slot.on .snm { color: var(--hot); }
  .slot .sb { font-size: 9px; letter-spacing: .06em; min-height: 11px; }
  .slot .sb .live { color: var(--ok); }
  .slot .sb .tgt { color: var(--r); }
  /* The ones that ship read as a different class of thing from the ones you
     made — same tile, quieter ground, and they cannot be forgotten. */
  .slot.builtin { background: #0c1116; border-color: #1f2832; }
  .slot.builtin .sn { color: #4f5b68; }
  #slots .libhead { grid-column: 1 / -1; font-size: 10px; letter-spacing: .1em;
                    color: var(--dim); padding: 6px 2px 0; }
  #buildMain { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; }
  #buildMain .brow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
                     padding: 5px 12px; border-bottom: 1px solid var(--line);
                     font-size: 11px; color: var(--dim); }
  #buildMain .brow .cap { letter-spacing: .1em; flex: none; }
  #buildMain .brow .sp { flex: 1; }
  #buildMain .bmid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, 32%); min-height: 0; }
  #buildMain input[type=text] { background: #0f141a; color: var(--ink); border: 1px solid #263039;
                     border-radius: 3px; padding: 1px 4px; font: inherit; width: 9em; }
  #buildMain input[type=text]:focus { outline: none; border-color: var(--hot); }
  /* The strip is the answer to "what did I just import": one card per wave,
     drawn, named and graded, rather than a count and the worst fit. */
  #strip { display: flex; gap: 6px; align-items: flex-start; padding: 6px 10px;
           border-top: 1px solid var(--line); overflow-x: auto; min-height: 72px; }
  #strip .empty { color: var(--dim); font-size: 11px; padding: 18px 4px; }
  .card { flex: 0 0 auto; width: 106px; background: #0f141a; border: 1px solid #263039;
          border-radius: 3px; padding: 3px; cursor: pointer; }
  .card:hover { border-color: #3a4855; }
  .card.on { border-color: var(--hot); }
  .card canvas { display: block; width: 98px; height: 32px; }
  .card .cn { font-size: 10px; color: var(--dim); white-space: nowrap; overflow: hidden;
              text-overflow: ellipsis; }
  .card.on .cn { color: var(--hot); }
  .card .cf { font-size: 9px; color: var(--dim2); }
  .card .cf.poor { color: #ff9a5c; }
  .card { position: relative; }
  /* On hover only: a row of two dozen cards each wearing a delete button is a
     row that looks like it is asking to be dismantled. */
  .card .cx { position: absolute; top: 1px; right: 1px; padding: 0 3px; line-height: 1.1;
              background: #0f141a; border: 1px solid #263039; border-radius: 2px;
              color: var(--dim); font: inherit; font-size: 10px; cursor: pointer;
              opacity: 0; transition: opacity .1s; }
  .card:hover .cx, .card.on .cx { opacity: 1; }
  .card .cx:hover { color: var(--bad); border-color: var(--bad); }
  .pane { position: relative; min-width: 0; min-height: 0; border-right: 1px solid var(--line); }
  .pane:last-child { border-right: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  .overlay { position: absolute; left: 10px; top: 8px; display: flex; gap: 4px; flex-wrap: wrap; }
  .overlay button { padding: 1px 6px; font-size: 11px; color: var(--dim); }
  .overlay button.on { color: var(--hot); }
  .label { position: absolute; right: 10px; top: 8px; color: var(--dim); font-size: 11px; letter-spacing: .1em; }
  footer { display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 5px 12px; border-top: 1px solid var(--line); color: var(--dim); font-size: 12px; }
  footer b { color: var(--ink); font-weight: 500; }
  footer .warn b { color: var(--bad); }
  #drawer { border-top: 1px solid var(--line); padding: 6px 12px; display: none; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 4px 18px; font-size: 11px; color: var(--dim); max-height: 34vh; overflow: auto; }
  #drawer.show { display: grid; }
  #drawer label { display: flex; align-items: center; gap: 8px; min-width: 0; }
  #drawer label span { flex: 0 0 72px; white-space: nowrap; overflow: hidden; }
  #drawer label output { flex: 0 0 68px; text-align: right; color: var(--ink); white-space: nowrap; }
  #drawer input[type=range] { flex: 1 1 60px; min-width: 60px; accent-color: var(--hot); height: 14px; margin: 0; }
  #drawer h4 { grid-column: 1 / -1; margin: 4px 0 0; font-weight: 500; color: var(--dim); font-size: 11px; letter-spacing: .1em; }
  #msg { color: var(--dim); }
</style>
</head>
<body>
<header>
  <span class="name">Kyklophoria</span>
  <button class="tab on" id="tabPlay">play</button>
  <button class="tab" id="tabBuild">build</button>
  <button class="tab" id="tabLib">worlds</button>
  <span id="modinfo" style="color:var(--dim)">not connected</span>
  <span class="sp"></span>
  <span id="msg"></span>
  <button id="btnSerial">Serial</button>
  <button id="btnBridge">Bridge</button>
  <button id="btnDrawer" hidden>Controls</button>
  <button id="btnClose" hidden>Disconnect</button>
</header>
<nav id="worldbar">
  <div class="wrow">
    <span class="cap" id="worldCap">WORLD</span>
    <span id="worldChips"></span>
  </div>
  <div class="wrow">
    <span class="cap">SHADE</span>
    <span id="shadeChips"></span>
    <span class="sp"></span>
    <span class="cap">TAIL</span>
    <span id="trailChips"></span>
  </div>
  <div class="wrow">
    <span id="worldNote"></span>
  </div>
  <div class="wrow">
    <span class="cap">MORPH</span>
    <select id="morphSel"><option value="255">off</option></select>
    <button class="chip" id="morphDirect">direct</button>
    <button class="chip" id="morphAim">aimed</button>
    <span id="morphState" style="color: var(--dim)"></span>
    <span class="sp"></span>
    <span class="cap">CARD</span>
    <select id="cardSel"></select>
    <button class="chip" id="cardLoad">load</button>
    <button class="chip" id="cardScan">rescan</button>
    <span id="cardState" style="color: var(--dim)"></span>
  </div>
  <div class="wrow">
    <span class="cap">MOTION</span>
    <span id="muteChips"></span>
  </div>
</nav>
<main id="playMain">
  <div class="pane">
    <canvas id="space"></canvas>
    <div class="overlay" id="axes"></div>
    <div class="label">SPACE</div>
  </div>
  <div class="pane">
    <canvas id="sound"></canvas>
    <div class="label">SOUND</div>
  </div>
</main>
<section id="buildMain" hidden>
  <div class="brow">
    <span class="cap">WAVES</span>
    <input type="file" id="wavIn" accept=".wav,audio/wav" multiple hidden>
    <button class="chip" id="wavPick">add wavs…</button>
    <button class="chip" id="wavMode">shape</button>
    <button class="chip" id="wavClear">clear</button>
    <button class="chip" id="wavNew">new from Lock</button>
    <span class="sp"></span>
    <span class="cap">WORLD</span>
    <input type="text" id="wavName" maxlength="16" placeholder="name" spellcheck="false">
    <button class="chip" id="wavPlace">re-place</button>
    <button class="chip" id="wavKeep">add to worlds</button>
    <button class="chip" id="wavSend">play it now</button>
    <button class="chip" id="wavSave">save…</button>
    <span id="wavState" style="color: var(--dim)"></span>
  </div>
  <div class="brow">
    <span class="cap">EFFECTS</span>
    <span style="color: var(--dim)">axis 4</span>
    <select id="fxA"></select>
    <span style="color: var(--dim)">axis 5</span>
    <select id="fxB"></select>
    <span id="fxState" style="color: var(--dim)"></span>
  </div>
  <div class="brow">
    <span class="cap">HEAR</span>
    <button class="chip" id="audPlay">audition</button>
    <button class="chip" id="audA">as imported</button>
    <button class="chip" id="audB">band-limited</button>
    <button class="chip" id="audC">as rendered</button>
    <span id="audState" style="color: var(--dim)"></span>
  </div>
  <div class="bmid">
    <div class="pane">
      <canvas id="plane"></canvas>
      <div class="overlay" id="planeAxes"></div>
      <div class="label">PLACE</div>
    </div>
    <div class="pane">
      <canvas id="inspect"></canvas>
      <div class="label">WAVE</div>
    </div>
  </div>
  <div id="strip"></div>
</section>
<section id="libMain" hidden>
  <div class="brow">
    <span class="cap">WORLDS</span>
    <button class="chip" id="libPlay">play</button>
    <button class="chip" id="libTarget">morph towards</button>
    <button class="chip" id="libNoTarget">no target</button>
    <button class="chip" id="libEdit">open to edit</button>
    <button class="chip" id="libFree">forget</button>
    <span class="sp"></span>
    <span class="cap">CARD</span>
    <button class="chip" id="libSave">save to card</button>
    <select id="libCardSel"></select>
    <button class="chip" id="libLoad">into the slot</button>
    <button class="chip" id="libRescan">rescan</button>
    <span id="libState" style="color: var(--dim)"></span>
  </div>
  <div class="brow">
    <span class="cap">LOOP</span>
    <button class="chip" id="tourAdd">add stop</button>
    <button class="chip" id="tourDrop">drop last</button>
    <button class="chip" id="tourClear">clear</button>
    <span class="cap">EVERY</span>
    <select id="tourDiv"></select>
    <span class="cap">CLOCKS ON J2</span>
    <div id="tourStops"></div>
    <span class="sp"></span>
    <span id="tourState" style="color: var(--dim)"></span>
  </div>
  <div id="slots"></div>
</section>
<div id="drawer"></div>
<footer>
  <span>module <b id="sMod">—</b></span>
  <span>block <b id="sBlock">—</b></span>
  <span>f0 <b id="sF0">—</b></span>
  <span>kcut <b id="sKcut">—</b></span>
  <span>spread <b id="sSpread">—</b></span>
  <span>link <b id="sLink">—</b></span>
  <span id="sCpuWrap">cpu <b id="sCpu">—</b></span>
  <span>space <b id="sSpace">—</b></span>
</footer>
<script src="link.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const MVL = window.KYK;

/* ── state ─────────────────────────────────────────────────────────── */
let link = null, info = null, desc = null, space = null;
/* The panel, as the module describes it.
 *
 * The descriptor has carried the jacks since M2 and nothing about the knobs,
 * not because the page ignored it but because the firmware never called
 * Host::Pages — the names, idents and units were all declared and never
 * published. With that one line the pager component arrives as
 * { pages, pots, pageNames[], fields:[{id,name,page,pot,disp,...}] } and the
 * page can mirror the panel rather than describe it in the abstract. */
let panel = null;
function parsePanel(d) {
  if (!d) return null;
  const walk = (o) => {
    if (!o || typeof o !== 'object') return null;
    if (Array.isArray(o)) { for (const v of o) { const r = walk(v); if (r) return r; } return null; }
    if (Array.isArray(o.fields) && o.pots > 0 && o.pages > 0) return o;
    for (const k of Object.keys(o)) { const r = walk(o[k]); if (r) return r; }
    return null;
  };
  const pg = walk(d);
  if (!pg) return null;
  const pots = pg.pots | 0, pages = pg.pages | 0;
  const grid = Array.from({ length: pages }, () => new Array(pots).fill(null));
  for (const f of pg.fields) {
    if (f == null || f.page >= pages || f.pot >= pots) continue;
    grid[f.page][f.pot] = { name: f.name || f.id || '', id: f.id || '', disp: f.disp || null };
  }
  return { pages, pots, names: pg.pageNames || [], colors: pg.pageColors || [], grid };
}   /* space: parsed 0x61, null when analytic */
let tel = null;                 /* latest telemetry */
let stats = null;               /* latest 0x63 */
let axes = [0, 1];              /* projection */
let worlds = null;              /* { current, list } from 0x65 */
let switching = -1;             /* world index mid-switch, or -1 */
/* An analytic world is a formula small enough to hold here, so the page can
 * evaluate the whole space itself and shade it rather than drawing dots at
 * the few points the module happens to sample. */
let basis = null, basisWorld = -1;
/* The first two labels used to name the wrong quantities: index 0 computes
   what the firmware calls `centroid`, and index 2 computes what it calls
   `bright`. */
const SHADE = [
  { id: 'centroid', label: 'centroid' },
  { id: 'flat', label: 'flatness' },
  { id: 'high', label: 'high end' },
];
let shadeIdx = 0;

/* Terrain palettes.
 *
 * Four palettes and an off switch, because "which colours" is a taste question
 * and measurement cannot answer it — only rule out the answers that are
 * unreadable. All four are monotone in L*, which is what keeps a map legible
 * rather than decorative, and all four are weighted dark: between 48% and 57%
 * of each ramp sits below L*20, so the field reads as black with structure
 * emerging from it.
 *
 * That weighting is a reversal and worth recording. An earlier pass re-spaced
 * the stops for uniform perceptual steps, which is the right objective if you
 * want to read fine structure everywhere — and it lifted the mid-tone from
 * L*25 to L*41, so the page stopped looking black. Even lightness steps and a
 * dark field are not the same goal, and the second one is the one that was
 * actually wanted here.
 */
const PAL_STOPS = [0, 0.44, 0.70, 0.88, 1];
const PALETTE = [
  { id: 'ember',     lut: [[6,7,10],[38,18,20],[110,45,28],[196,116,44],[255,214,150]] },
  { id: 'ink',       lut: [[6,7,12],[22,24,58],[64,52,140],[118,110,214],[196,214,255]] },
  { id: 'verdigris', lut: [[5,9,10],[16,38,38],[30,88,80],[92,164,132],[214,238,206]] },
  { id: 'ash',       lut: [[8,8,9],[40,40,42],[92,92,96],[160,160,166],[240,240,244]] },
  { id: 'off',       lut: null },
];
let palIdx = 0;
try { const v = localStorage.getItem('kyk.pal'); if (v !== null) palIdx = Math.max(0, Math.min(PALETTE.length - 1, +v)); } catch {}
const RAMPS = PALETTE.map(p => {
  if (!p.lut) return null;
  const lut = new Uint8Array(256 * 3);
  for (let i = 0; i < 256; i++) {
    const t = i / 255; let a = 0;
    for (let q = 0; q < 4; q++) if (t >= PAL_STOPS[q] && t <= PAL_STOPS[q + 1]) { a = q; break; }
    const lo = PAL_STOPS[a], hi = PAL_STOPS[a + 1];
    const u = hi > lo ? (t - lo) / (hi - lo) : 0;
    for (let c = 0; c < 3; c++) lut[i * 3 + c] = Math.round(p.lut[a][c] + (p.lut[a + 1][c] - p.lut[a][c]) * u);
  }
  return lut;
});

const terrain = { key: '', canvas: null, res: 72, at: 0, flat: false };
/* Buffers are allocated once at the longest tail; `cap` is how much of them is
   live, so changing the length costs no allocation. C holds the timbre each
   sample was taken at, so an old stretch of path keeps the colour it had
   rather than being repainted with the present. */
const TRAIL_MAX = 1800;
const TAILS = [{ label: 'short', n: 150 }, { label: 'med', n: 400 },
               { label: 'long', n: 900 }, { label: 'max', n: TRAIL_MAX }];

   * only on success. Press it twice and the loser's catch calls disconnect(),
   * which tears down whatever `link` points at by then: the winner. Both die
   * and the status line blames the link.

   * the earlier one retires quietly, which is what pressing the button again
   * means. */

  if (gen !== connectGen) return;

  link.onClose = () => { say('link closed'); disconnect(); };
  link.onError = e => say('link error: ' + (e && e.message || e), true);

    await link.start();
    info = await MVL.hello(link);

    panel = parsePanel(desc);

     * failure to connect. */
    space = await refreshSpace();

    if (gen !== connectGen) { try { await transport.close(); } catch {} return; }
    say('connect failed: ' + e.message, true); await disconnect(); return;
  }
  if (gen !== connectGen) { try { await transport.close(); } catch {} return; }
  $('modinfo').textContent = `${info.name} · fw ${info.fw} (${info.git}) · ${transport.kind}`;
  $('sMod').textContent = info.id + ' ' + info.fw;

/* ── worlds ─────────────────────────────────────────────────────────────

/* ── importing waveforms and placing them ────────────────────────────────
 *
 * WaveEdit and the AKWF corpus already make and shape single cycles better
 * than anything worth writing here, so this only imports and places: the part
 * that is specific to an N-dimensional instrument and that no existing tool
 * does.
 *
 * Placement defaults to the 24-cell's own vertices — the same arrangement the

/* A send landed, so the module now holds exactly this. */

  held = { name: worldName(), nodes: imported.map(w => ({ name: w.name, pos: w.pos.slice() })) };

/* And the module is not holding it any more. One function, because there are
   five ways to lose it — a built-in selected, a card world loaded, the link
   dropped, a refresh that reports a built-in is live, a send that failed — and
   four of them were written separately the first time. */

  held = null;

/* The 24-cell: every permutation of (+-1, +-1, 0, 0), walked plane by plane so
   vertex group g lands in Givens plane g (core/kyk_lock.h). */
function cellPositions(count) {
  const out = [], r = 0.42;
  for (let i = 0; i < 4 && out.length < count; i++)
    for (let j = i + 1; j < 4 && out.length < count; j++)
      for (let si = -1; si <= 1 && out.length < count; si += 2)
        for (let sj = -1; sj <= 1 && out.length < count; sj += 2) {
          const p = [0.5, 0.5, 0.5, 0.5];
          p[i] = 0.5 + si * r * 0.7071;
          p[j] = 0.5 + sj * r * 0.7071;
          out.push(p);

/* Take one wave out and leave the rest where they are.
 *
 * Deliberately not followed by a re-place: the other nodes keep the positions
 * you put them in, because removing a wave is not a reason to rearrange the
 * ones you kept. The selection follows the contents — the node after the gap
 * keeps its identity even though its index moved — and anything auditioning
 * stops, since the sound belonged to a node that no longer exists.

  if (i < 0 || i >= imported.length) return;
  if (audition.node === i) auditionStop();
  else if (audition.node > i) audition.node -= 1;
  imported.splice(i, 1);
  if (place.sel === i) place.sel = -1;
  else if (place.sel > i) place.sel -= 1;

  /* Keep the module in step if it is holding this set — unless there is nothing
     left, since a world of no nodes is not a world the format can express. */
  /* Guarded here as well as inside syncPlacement. Redundant on purpose: either
     one alone prevents sending an empty set, and this is the path where it is
     obvious *why* it must not happen. */
  if (imported.length) syncPlacement();
  else { place.sent = false; renderImport(); }

/* Back to the arrangement you were given. Placement is the part of curating
   that is easy to make a mess of, and there was no way back from a mess. */
function placeOnCell() {
  const cell = cellPositions(24);
  imported.forEach((w, i) => { w.pos = cell[i].slice(); });
  place.sel = -1;

/* ── moving a node ────────────────────────────────────────────────────────
 *
 * A square of the space draws two axes of four, so a drag sets those two and
 * leaves the rest alone; the other two are reached either by switching the
 * pair or, in the build view, by dragging in the inset that draws them. That
 * is not a compromise for want of a 4-D input device — the instrument is
 * played one Givens plane at a time, and placing a node the same way puts it
 * somewhere you can describe.

 * Everything that hit-tests or draws a node takes a *box*: which two axes it
 * shows, where it sits on which canvas, how big. The play view's read-only
 * square, the build view's main square and its inset are three boxes and one
 * piece of code, so they cannot drift apart — the bug where the pointer and
 * the projection disagree can only be written once.
 *
 * Positions are clamped to the cube. The format does not require it (the
 * parser checks only that coefficients are finite) and a node outside is
 * legal, merely far away — but no knob can reach outside, so a node out there
 * would be one you could never arrive at, which is not a thing to let a drag
 * do by accident.
 */
const planeBoxes = [];         /* the build view's squares, rebuilt each frame */
const boxX = (b, u) => b.ox + clamp01(u) * b.S;

   complementary plane, which is why the inset can be exactly one square and
   why placing a node is finished in one view. Beyond four there is no unique
   complement, so it shows the lowest two that are missing and says which. */
function otherAxes(n) {
  const out = [];
  for (let a = 0; a < n && out.length < 2; a++) if (a !== axes[0] && a !== axes[1]) out.push(a);

/* Which slice the fade is measured against.

 * In the build view it is the node in your hand: the useful question while

/* How far a node sits from that slice, in the axes this box does not show.

   — is any one of the axes I cannot see far away — and because the 24-cell's

  const ref = sliceRef();
  if (!ref) return 0;

  /* Bounded by the node's own dimension, not the module's. A four-dimensional
     world sent to a module running a six-dimensional one is a real state — the
     page draws whatever is live — and reading past the end of pos would make
     every distance NaN and every node fully bright, which is the opposite of
     what the fade is for. */
  for (let a = 0; a < Math.min(w.pos.length, ref.length); a++)
    if (a !== b.ax && a !== b.ay) d = Math.max(d, Math.abs(w.pos[a] - ref[a]));

 * eye is concerned. A node from another plane projecting onto the same spot is
 * drawn dim, and grabbing the dim one when a bright one is there would feel
 * like the page picked at random. */
function pickNode(b, x, y) {
  let best = -1, score = 1e9;
  for (let i = 0; i < imported.length; i++) {
    const w = imported[i];
    if (b.ax >= w.pos.length || b.ay >= w.pos.length) continue;
    const d = Math.hypot(boxX(b, w.pos[b.ax]) - x, boxY(b, w.pos[b.ay]) - y);
    if (d > 11) continue;
    const sc = d + 40 * offPlane(w, b);
    if (sc < score) { score = sc; best = i; }
  }
  return best;
}

function moveNodeTo(i, b, x, y) {
  const w = imported[i];
  if (!w || b.ax >= w.pos.length || b.ay >= w.pos.length) return;
  w.pos[b.ax] = clamp01((x - b.ox) / b.S);
  w.pos[b.ay] = clamp01(1 - (y - b.oy) / b.S);
}

/* Which square a press landed in. The inset is tested first because it is
   drawn on top of the main one, and both are given a few pixels of slack so a
   node can be pushed right into a corner rather than stopping short of it. */
function boxAt(x, y) {
  for (let i = planeBoxes.length - 1; i >= 0; i--) {
    const b = planeBoxes[i];
    if (x >= b.ox - 8 && x <= b.ox + b.S + 8 && y >= b.oy - 8 && y <= b.oy + b.S + 8) return b;
  }
  return null;
}

/* Keep the module holding what is on screen, without piling up transfers.
 *
 * A drag can end many times in a second and a world is about 6.5 KB over
 * seven chunked requests, so a send in flight collects one trailing resend
 * rather than a queue of them: the last position is the one that matters and
 * the intermediate ones are already stale. A failure turns the syncing off
 * rather than retrying, because the alternative is a failure storm behind a
 * link that has gone away. */
let placeSending = false, placeAgain = false;
async function syncPlacement() {
  if (!link || !place.sent || !imported.length) return;
  if (placeSending) { placeAgain = true; return; }
  placeSending = true;
  try {
    do { placeAgain = false; await MVL.putWorld(link, importedBlob()); heldSent(); } while (placeAgain);
  } catch (e) {
    heldLost();
    say('the module stopped taking the moved world: ' + e.message, true);
  } finally { placeSending = false; renderImport(); }
}

/* Picking one is picking it everywhere: the card, the rings in both squares
   and the inspector are one selection seen from four places. */
function selectNode(i) {
  if (place.sel === i) return;
  place.sel = i;
  /* What is playing belongs to the node it was built from, so picking another
     one stops it rather than leaving a sound with no label. */
  if (audition.node >= 0 && audition.node !== i) auditionStop();
  renderStrip();
  renderImport();
  renderAudition();
}

function renderImport() {
  const n = imported.length;
  $('wavMode').textContent = importMode;
  $('wavSend').disabled = !link || !n;
  /* Saving deliberately does not need a module. Curating a set of waveforms
     into a file and copying it to the card is a whole way of using this page,
     and there is nothing for a link to do in it. */
  $('wavSave').disabled = !n;
  $('wavNew').disabled = !link;
  $('wavKeep').disabled = !link || !n;
  $('wavPlace').disabled = !n;
  $('wavClear').disabled = !n;
  if (!n) { $('wavState').textContent = link ? '' : 'connect to send'; return; }
  /* The fit is the fraction of each wave that survives projection onto the
     sine basis. Showing the worst is the useful summary: it is the one the
     person choosing waveforms would want to reconsider. */
  let worst = 1, worstName = '';
  for (const w of imported) if (w.fit < worst) { worst = w.fit; worstName = w.name; }
  const sel = imported[place.sel];
  /* While a node is picked, the row says where that node is rather than how
     the set as a whole projected: during placement it is the only number
     anybody wants, and it is the one the canvas cannot show (two of its four
     axes are off screen). */
  $('wavState').textContent = sel
    ? `${sel.name} at ${[...sel.pos].map(v => v.toFixed(2)).join(' ')}${place.sent ? ' · following' : ''}`
    : importMode === 'spectrum'
      ? `${n} wave${n > 1 ? 's' : ''} · spectrum kept exactly, waveform redrawn`
      : `${n} wave${n > 1 ? 's' : ''} · worst fit ${(100 * worst).toFixed(0)}% (${worstName})`;
}

async function addWavs(files) {
  const cell = cellPositions(24);
  for (const f of files) {
    if (imported.length >= 24) { say('24 nodes is the limit', true); break; }
    try {
      const cyc = MVL.wavToCycle(new Uint8Array(await f.arrayBuffer()));
      const nd = MVL.cycleToNode(cyc, 64, importMode);
      /* A vertex to start on, which is where placement used to end. The
         arrangement is the same one it always was; the difference is that the
         node owns it now and can be moved off it. */
      /* The original cycle is kept, turned to line up with what came out of
         the projection. It is the only way to show what import cost: the fit
         is a number, and a number does not tell you whether the 6% that went
         missing was the edge of a saw or the whole character of a vowel. */
      imported.push({ name: f.name.replace(/\.wav$/i, ''), mags: nd.mags, fit: nd.fit,
                      mode: importMode, pos: cell[imported.length].slice(),
                      render: renderFromMags(nd.mags),
                      thumb: rotatedCycle(cyc, nd.rotation || 0) });
    } catch (e) { say(f.name + ': ' + e.message, true); }
  }
  renderStrip();
  renderImport();
}

/* The name goes both in the file and on it: sixteen bytes in the blob header
   (core/kyk_userworld.h) and the stem of the download, so the world you hear
   on the module and the file sitting on the card are the same thing under the
   same name. Non-ASCII is dropped rather than transliterated — the header is a
   char[16] and the module's list draws bytes, so an accented name would arrive
   as mojibake on a 128x64 screen. */
function worldName() {
  const raw = ($('wavName').value || '').replace(/[^\x20-\x7e]/g, '').trim();
  return (raw || 'import').slice(0, 16);
}

/* Send and save build the world here and nowhere else, so what you heard and
   what you kept cannot drift apart. That is not hypothetical tidiness: the two
   paths differing by a placement rule or a sigma is exactly the sort of thing
   nobody would notice until a saved file sounded wrong months later. */
/* Effects go on axes 4 and 5 and never on a placement axis.
 *
 * The format allows any axis, and putting one on axis 2 would also have worked
 * — but then the depth is wherever the blend has got to, so "open the folder"
 * and "cross the space" become one gesture and neither is available alone. Axes
 * 4 and 5 exist precisely because there are six axes and four position CVs;
 * they have been reachable from the web page and from nowhere a hand could get
 * at since the beginning. The module's World page gives them the two pots.
 *
 * Every node sits at 0.5 on them, which is exactly neutral: the distance term
 * is then the same constant for every node, and a constant cancels out of the
 * softmax. So the axis moves the effect and nothing else. */
function fxSel() {
  const k = (id) => Number($(id).value) || 0;
  return [{ axis: 4, kind: k('fxA') }, { axis: 5, kind: k('fxB') }].filter(f => f.kind);
}
function importedBlob() {
  const fx = fxSel();
  return MVL.buildUserWorld(imported.map(w => ({ pos: w.pos, mags: w.mags })),
                            { n: fx.length ? 6 : 4, k: 64, sigma: 0.26, name: worldName(), fx });
}

/* The effect selectors. Changing one changes the world, so it re-sends exactly
   the way moving a node does — through syncPlacement, which is the one path
   that knows whether the module is holding this set. */
function buildFxSelects() {
  for (const id of ['fxA', 'fxB']) {
    const sel = $(id);
    sel.innerHTML = '';
    MVL.SHAPER_NAME.forEach((nm, i) => {
      const o = document.createElement('option');
      o.value = String(i); o.textContent = nm;
      sel.appendChild(o);
    });
    sel.onchange = () => { renderFx(); syncPlacement(); };
  }
}
const FX_SAYS = {
  fold: 'wavefolds the cycle — the dirtiest of these, and it pulls the band limit in to make room',
  ring: 'ring-modulates against a whole-numbered carrier, so it stays on the harmonic series and stays clean',
  warp: 'phase-distorts the cycle, Casio-style, without leaving the series',
  crush: 'reduces the cycle to fewer bits, 8 down to 1. Aliases on purpose',
  drop: 'holds the cycle at fewer values, 1024 down to 32. Aliases on purpose',
};
function renderFx() {
  const fx = fxSel();
  const bits = fx.map(f => `axis ${f.axis} ${MVL.SHAPER_NAME[f.kind]}s: ${FX_SAYS[MVL.SHAPER_NAME[f.kind]]}`);
  $('fxState').textContent = fx.length
    ? bits.join(' · ') + ' — the module reaches them on the World page'
    : 'an effect on axis 4 or 5 runs on the rendered cycle, after the blend';
}
buildFxSelects();
renderFx();

/* Export, which is the point of import.
 *
 * A sent world lives in RAM and the card is read-only from the module, so
 * until now nothing anyone placed could be kept: close the tab or power the
 * module down and the arrangement was gone. The bytes are the module's own
 * `.kykw` — drop the file in /kyklophoria on the card and it is in the CARD
 * list at the next scan, and it is the same file to hand to somebody else.
 *
 * The blob round-trips exactly by design (f32 coefficients, not the u8 log
 * encoding telemetry uses), so the file holds the coefficients the module was
 * sent and not a quantised likeness of them. Reading a `.kykw` back into the
 * page is not built: the card and the module can load one, this can only
 * write one. */
function exportImported() {
  if (!imported.length) return;
  const blob = importedBlob(), name = worldName();
  /* The header keeps the name as typed; the filename cannot. Spaces and
     anything a filesystem would argue about become dashes, and a name that is
     nothing but punctuation falls back rather than saving as ".kykw". */
  const file = name.replace(/[^A-Za-z0-9._-]+/g, '-').replace(/^-+|-+$/g, '') || 'import';
  const url = URL.createObjectURL(new Blob([blob], { type: 'application/octet-stream' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = file + '.kykw';
  document.body.appendChild(a);
  a.click();
  a.remove();
  /* Revoked late rather than immediately: revoking in the same task cancels
     the download in Firefox, which is a bug that only ever shows up in the one
     browser you did not test in. */
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  say(`saved ${file}.kykw — ${imported.length} node${imported.length > 1 ? 's' : ''}, ${blob.length} bytes`);
}

/* Open whatever the module is playing, as an editable set.
 *
 * Two routes, and which one you get depends on what is live. A world that came
 * from a slot is read back *exactly* — the bytes it was given. A built-in cannot
 * be handed over as nodes at all, because a formula is not twenty-four spectra,
 * so the module samples it at the 24-cell vertices and what you get is honestly
 * a snapshot: it renders at sine phase, so a phase-blind world will not sound
 * like the original, and for the vertex worlds it will sound better.
 *
 * The snapshot needs somewhere to live, so it takes a free slot and says which.
 * That is not a workaround — having it in a slot is useful, and it means capture
 * and the library are the same object rather than two ideas about the same
 * bytes. */
/* Open a world in the build tab, whichever kind it is.
 *
 * One of yours comes back *exactly* — the bytes it was given. One that ships
 * cannot be handed over as nodes at all, because a formula is not twenty-four
 * spectra, so the module samples it at the 24-cell vertices and the result says
 * it is a snapshot: it renders at sine phase, so a phase-blind world will not
 * sound like its original, and for the vertex worlds it will sound better.
 *
 * A sampled world needs somewhere to live while it is read back, and it borrows
 * a free slot and gives it back. Opening one to look at it should not cost you a
 * slot; keeping it is what "add to worlds" is for.
 */
async function openForEdit(spec) {
  if (!link) return;
  try {
    let slot = spec.slot, borrowed = -1;
    if (slot === undefined) {
      await refreshSlots();
      const free = freeSlot();
      if (free < 0) { say('every slot is full — forget one first', true); return; }
      const args = [free, spec.world & 0xff];
      await link.request(MVL.CMD.action, MVL.actionReq(MVL.ACT.snapshot, args), { urgent: true, timeoutMs: 4000 });
      slot = free;
      borrowed = free;
      await refreshSlots();
    }
    const blob = await MVL.fetchSlot(link, slot, info ? info.maxBody : 1024);
    const w = blob && MVL.parseUserWorld(blob);
    if (borrowed >= 0) {
      /* given back, so looking at a world costs nothing */
      try { await link.request(MVL.CMD.action, MVL.actionReq(MVL.ACT.slotFree, [borrowed]), { urgent: true }); } catch {}
      await refreshSlots();
    }
    if (!w) { say('the module did not hand back a world', true); return; }
    auditionStop();
    imported.length = 0;
    w.nodes.forEach((nd, i) => imported.push({
      name: `${w.name || 'world'} ${i}`,
      mags: nd.mags, fit: 1, mode: 'captured',
      pos: nd.pos.slice(),
      render: renderFromMags(nd.mags),
      /* No `thumb`: there is no imported cycle behind one of these, so the
         inspector draws and plays only what the engine makes of it. Inventing a
         second trace would be inventing the thing import measures. */
    }));
    place.sel = -1; place.sent = false;
    $('wavName').value = (w.name || 'world').slice(0, 16);
    /* The effects come back with it, or the edit would quietly drop them. */
    $('fxA').value = String((w.fx.find(f => f.axis === 4) || {}).kind || 0);
    $('fxB').value = String((w.fx.find(f => f.axis === 5) || {}).kind || 0);
    renderFx();
    renderStrip(); renderImport(); renderAudition();
    setView('build');
    say(borrowed >= 0
        ? `${w.name} opened — ${w.count} nodes sampled at the vertices, rendered at sine phase`
        : `${w.name} opened — ${w.count} nodes, exactly as stored`);
  } catch (e) { say('open: ' + e.message, true); }
}

/* Lock is the natural blank canvas: twenty-four real waveforms on the 24-cell,
   one family per rotation plane, which beats an empty set and beats a slot
   pre-filled with silence — a blank world plays silence, and silence that looks
   deliberate is the worst state a synth can show. */
const newFromLock = () => openForEdit({ world: 13 });

async function sendImported() {
  if (!link || !imported.length) return;
  const blob = importedBlob();
  try {
    await MVL.putWorld(link, blob, (done, all) =>
      say(`sending ${(100 * done / all).toFixed(0)}%`));
    place.sent = true;
    heldSent();
    say(`${worldName()}: ${imported.length} waveforms placed (${blob.length} bytes) — moving one now follows`);
    setTimeout(() => refreshWorlds(), 250);
  } catch (e) { say('send: ' + e.message, true); }
}

/* Which motions are switched off.
 *
 * A mute rather than turning a rate to zero: the knob keeps its value, so
 * unmuting restores what was set. That is the whole difference between a
 * switch and turning something down, and it is why this could not just be
 * "put the rate knob at the bottom".
 *
 * The mask is authoritative on the module and echoed in telemetry, so these
 * chips follow the module rather than remembering their own state — which
 * matters because a preset load or another page can change it. */
function renderMuteChips() {
  const box = $('muteChips'); box.innerHTML = '';
  const mask = tel ? (tel.mute | 0) : 0;
  const n = tel ? tel.n : 4, planes = MVL.planeCount(n);
  const add = (label, bit, title) => {
    const b = document.createElement('button');
    const off = (mask & bit) !== 0;
    b.className = 'chip' + (off ? '' : ' on');
    b.textContent = label;
    b.title = title + (off ? ' — muted' : ' — running');
    b.disabled = !link;
    b.onclick = async () => {
      if (!link) return;
      const next = mask ^ bit;
      try {
        await link.request(MVL.CMD.action,
                           MVL.actionReq(9, [next & 0xff, (next >> 8) & 0xff]), { urgent: true });
      } catch (e) { say('mute: ' + e.message, true); }
    };
    box.appendChild(b);
  };
  for (let p = 0; p < planes; p++) {
    const [i, j] = MVL.planeAxes(n, p);
    add(`${i}${j}`, 1 << p, `rotation plane ${i},${j}`);
  }
  const sep = document.createElement('span');
  sep.textContent = '·'; sep.style.color = 'var(--dim)'; sep.style.padding = '0 2px';
  box.appendChild(sep);
  add('kepler', 0x8000, 'the falling body');
}

function renderTrailChips() {
  const box = $('trailChips'); box.innerHTML = '';
  const group = (items, cur, pick) => {
    for (let i = 0; i < items.length; i++) {
      const b = document.createElement('button');
      b.className = 'chip' + (i === cur ? ' on' : '');
      b.textContent = items[i].label;
      b.onclick = () => { pick(i); renderTrailChips(); };
      box.appendChild(b);
    }
  };
  group(TAILS, tailIdx, i => {
    tailIdx = i; trail.cap = TAILS[i].n;
    /* the ring's arithmetic changes under it, so start the tail again rather
       than reinterpret samples written at the old length */
    trail.n = 0; trail.head = 0; trail.at = -1;
    try { localStorage.setItem('kyk.tail', String(i)); } catch {}
  });
  const sep = document.createElement('span');
  sep.textContent = '·'; sep.style.color = 'var(--dim)'; sep.style.padding = '0 2px';
  box.appendChild(sep);
  group(DENSITIES, densIdx, i => {
    densIdx = i; trail.n = 0; trail.head = 0; trail.at = -1;
    try { localStorage.setItem('kyk.dens', String(i)); } catch {}
  });
}

function renderShadeChips() {
  const box = $('shadeChips'); box.innerHTML = '';
  const live = !!basis;
  for (let i = 0; i < SHADE.length; i++) {
    const b = document.createElement('button');
    b.className = 'chip' + (i === shadeIdx && live ? ' on' : '');
    b.textContent = SHADE[i].label; b.disabled = !live;
    b.onclick = () => { shadeIdx = i; terrain.key = ''; renderShadeChips(); };
    box.appendChild(b);
  }
  const sep = document.createElement('span');
  sep.textContent = '·'; sep.style.color = 'var(--dim)'; sep.style.padding = '0 2px';
  box.appendChild(sep);
  for (let i = 0; i < PALETTE.length; i++) {
    const b = document.createElement('button');
    b.className = 'chip' + (i === palIdx ? ' on' : '');
    b.textContent = PALETTE[i].id;
    b.onclick = () => {
      palIdx = i; terrain.key = '';
      try { localStorage.setItem('kyk.pal', String(i)); } catch {}
      renderShadeChips();
    };
    box.appendChild(b);
  }
  if (!live) {
    const s = document.createElement('span');
    s.textContent = worlds ? 'tabulated, no formula to draw' : '';
    s.style.color = 'var(--dim)';
    box.appendChild(s);
  }
}
renderWorldBar();
renderTrailChips();
renderMuteChips();
renderMorphSel();
renderCardSel();
$('morphSel').onchange = async () => {
  if (!link) return;
  const v = parseInt($('morphSel').value, 10);
  try { await link.request(MVL.CMD.action, MVL.actionReq(5, [v & 0xff]), { urgent: true }); }
  catch (e) { say('morph target: ' + e.message, true); }
};
$('wavPick').onclick = () => $('wavIn').click();
$('wavIn').onchange = (e) => { addWavs([...e.target.files]); e.target.value = ''; };
$('wavMode').onclick = () => {
  importMode = importMode === 'shape' ? 'spectrum' : 'shape';
  /* re-project what is already loaded, or the two modes would be mixed */
  if (imported.length) say('re-import to change mode for waves already added');
  renderStrip();
  renderImport();
};
$('wavSend').onclick = sendImported;
$('wavSave').onclick = exportImported;
$('wavNew').onclick = newFromLock;
$('wavKeep').onclick = keepBuildSet;
$('wavPlace').onclick = () => { placeOnCell(); renderStrip(); renderImport(); syncPlacement(); };
$('wavClear').onclick = () => {
  auditionStop();
  imported.length = 0; place.sel = -1; place.sent = false;
  renderStrip(); renderImport();
};
renderStrip();
renderImport();
/* Direct or aimed, as a pair of chips rather than a button that fires and
   leaves no trace.
 *
 * Direct reads the target world at the same coordinates. Aimed searches it for
 * the position whose spectrum is nearest the one playing and reads there, which
 * is nearly always the better morph but means full morph is *not* the same as
 * simply selecting that world — and a button gave no way to tell which of those
 * you were hearing. The lit state comes from the module, not from remembering
 * what was last clicked. */
const setAim = async (on) => {
  if (!link) return;
  try {
    await link.request(MVL.CMD.action, MVL.actionReq(10, [on ? 1 : 0]), { urgent: true });
  } catch (e) { say('aim: ' + e.message, true); }
};
$('morphAim').onclick = () => setAim(true);
$('morphDirect').onclick = () => setAim(false);
$('cardScan').onclick = async () => {
  if (!link) return;
  try { await link.request(MVL.CMD.action, MVL.actionReq(6, []), { urgent: true }); await refreshCard(); }
  catch (e) { say('rescan: ' + e.message, true); }
};
$('cardLoad').onclick = async () => {
  if (!link) return;
  const i = $('cardSel').selectedIndex;
  if (i < 0 || !cardList.names.length) return;
  try {
    await link.request(MVL.CMD.action, MVL.actionReq(7, [i & 0xff]), { urgent: true });
    /* A card world is another user world: the module stops holding ours the
       moment this lands. This was missed the first time — `sent` stayed true
       across a card load, so the next drag would have quietly pulled the
       module back off the world somebody had just loaded. */
    heldLost();
    say('loading ' + cardList.names[i]);
    setTimeout(() => { refreshWorlds(); }, 250);
  } catch (e) { say('load: ' + e.message, true); }
};

/* ── polling ────────────────────────────────────────────────────────── */
async function pollTelemetry() {
  while (polling && link) {
    const t0 = performance.now();
    try {
      const b = await link.request(MVL.CMD.telemetry, MVL.telemetryReq(7), { key: 'tel', timeoutMs: 800 });
      const t = MVL.parseTelemetry(b);
      if (t) { tel = t; onTelemetry(t); }
    } catch (e) { if (!link) break; if (!/timeout/.test(e.message)) say('telemetry: ' + e.message, true); }
    const wait = 1000 / 60 - (performance.now() - t0);
    if (wait > 0) await new Promise(r => setTimeout(r, wait));
  }
}
async function pollStats() {
  while (polling && link) {
    try { stats = MVL.parseStats(await link.request(MVL.CMD.stats, new Uint8Array(0), { key: 'stats' })); } catch {}
    await new Promise(r => setTimeout(r, 1000));
  }
}
/* The last world the module said it was playing, so a change is noticed once
   rather than acted on sixty times a second. */
let seenWorld = -2, worldPoke = false;

/* The module says which world is live in every frame, so the page can stop
 * believing its own last instruction.
 *
 * Before this the live world was known only by asking for the list, and
 * nothing asked unprompted: a world changed from the module's own panel left
 * the world bar naming the previous one indefinitely, and left the play view
 * drawing the rings of a world that was no longer loaded. Both are readouts,
 * and a readout that can be wrong about its own subject is worse than none.
 */
function noticeWorld(t) {
  if (t.world == null || t.world === seenWorld) return;   /* null: older firmware */
  seenWorld = t.world;
  /* Ours is the only world with no index, so anything else means the module is
     holding something we did not put there. */
  if (t.world !== 0xFF && held) heldLost();
  if (switching >= 0) return;            /* a switch we asked for is settling */
  if (!worlds || worlds.current === t.world) return;
  /* Show it immediately, then settle the rest — the name is in the list we
     already have, while the basis and the space description need asking for. */
  worlds.current = t.world;
  renderWorldBar();
  if (worldPoke) return;
  worldPoke = true;
  refreshWorlds().finally(() => { worldPoke = false; });
}

function onTelemetry(t) {
  noticeWorld(t);
  /* Where the loop has got to. A length that disagrees with the row means the
     module changed the loop without being asked through this page — it stops one
     when a world is chosen by hand — so the row is re-read rather than redrawn
     from memory. */
  if (t.tour) {
    const was = tourLive.len;
    tourLive = t.tour;
    if (t.tour.len !== tourStops.length) readTour();
