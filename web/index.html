     * There was, at 0.6 when terrainKey() disagreed with the built key and
     * 0.92 when it matched. The key quantises the off-plane axes to a fortieth,
     * so with any motion at all it changes almost every frame, while the
     * rebuild is throttled to one per 150 ms — which produced a single bright
     * frame among every nine dark ones. A 53% brightness swing at about 7 Hz.
     * "Known-stale" is not an exceptional condition worth marking; it is what
     * the terrain always is while anything is moving. */
    cx.save(); cx.globalAlpha = 0.92; cx.imageSmoothingEnabled = true;
    cx.drawImage(terrain.canvas, ox, oy, S, S);
    cx.restore();
  }
  cx.strokeStyle = '#141b23'; cx.lineWidth = 1;
  cx.strokeRect(ox + .5, oy + .5, S, S);
  /* lattice dots, only where there is a lattice */
  if (space) {
    cx.fillStyle = '#3f5063';
    for (let i = 0; i < side; i++) for (let j = 0; j < side; j++) { cx.beginPath(); cx.arc(px(i / (side - 1)), py(j / (side - 1)), 1.6, 0, 7); cx.fill(); }
  }
  /* axis labels sit over the terrain, so give them a dark backing rather than
   * letting them vanish into the bright corner */
  cx.font = '11px ui-monospace, monospace';
  const axLabel = (text, x, y, rot) => {
    cx.save(); cx.translate(x, y); if (rot) cx.rotate(-Math.PI / 2);
    cx.lineWidth = 3; cx.strokeStyle = 'rgba(7,9,12,0.75)'; cx.strokeText(text, 0, 0);
    cx.fillStyle = basis ? '#8b98a6' : '#6b819d'; cx.fillText(text, 0, 0);
    cx.lineWidth = 1; cx.restore();
  };
  axLabel('axis ' + ax, ox + S - 44, oy + S - 6, false);
  axLabel('axis ' + ay, ox + 13, oy + 52, true);
  /* Now that the ramp is absolute, a slice with nothing in it paints one
     colour — which is correct, and indistinguishable from a slice that failed
     to build. So name it. */
  if (basis && terrain.key && terrain.flat) axLabel('flat field', ox + 8, oy + 26, false);
  /* wrap seams */
  if (space) for (const [a, edge] of [[ax, 'v'], [ay, 'h']]) if (space.topo[a] === 'wrap') {
    cx.setLineDash([3, 5]); cx.strokeStyle = '#3a4757'; cx.beginPath();
    if (edge === 'v') { cx.moveTo(px(0), py(0)); cx.lineTo(px(0), py(1)); cx.moveTo(px(1), py(0)); cx.lineTo(px(1), py(1)); }
    else { cx.moveTo(px(0), py(0)); cx.lineTo(px(1), py(0)); cx.moveTo(px(0), py(1)); cx.lineTo(px(1), py(1)); }
    cx.stroke(); cx.setLineDash([]);
  }
  /* What the module is holding, not what is being drafted on the other tab,
     and movable nowhere: this is a readout, and a readout you can edit by
     brushing against it is neither. */
  drawNodes(cx, { ax, ay, ox, oy, S }, playNodes(), { dim: 0.8 });
  if (!tel) { cx.fillStyle = '#6b819d'; cx.fillText('waiting for the module', ox + S / 2 - 70, oy + S / 2); drawArcs(n, planes, null, ox, oy + S + 18, S); return; }
  /* active cell around L — only a tabulated world has cells */
  if (space && side > 1) {
    const cw = 1 / (side - 1), ci = Math.min(side - 2, Math.max(0, Math.floor(tel.posL[ax] * (side - 1)))), cj = Math.min(side - 2, Math.max(0, Math.floor(tel.posL[ay] * (side - 1))));
    cx.fillStyle = 'rgba(98,213,255,0.06)'; cx.fillRect(px(ci * cw), py((cj + 1) * cw), cw * S, cw * S);
    cx.strokeStyle = 'rgba(98,213,255,0.25)'; cx.strokeRect(px(ci * cw) + .5, py((cj + 1) * cw) + .5, cw * S, cw * S);
  }
  /* The timbre at the dot, read off the same function that painted the
     ground, so the dot's colour and the colour under it mean one thing. */
  const tv = timbre.v;
  /* Trail: oldest first, alpha linear in recency, colour frozen at the moment
   * each sample was taken.
   *
   * The alpha used to be squared, which put nine tenths of the visible trail
   * into its newest third — a slow orbit showed a bright comma and a long
   * invisible tail, so the shape of the path, the entire reason the trail
   * exists, was legible only where it had barely moved. Linear spreads it over
   * all six hundred.
   *
   * Drawn in colour buckets rather than per sample. Every distinct fillStyle
   * string has to be parsed as CSS, and a per-sample rgba() string meant up to
   * 1200 of those per frame and 72,000 a second, to express a value that moves
   * slowly and is being quantised to a byte anyway. Sixteen buckets is
   * sixteen parses; globalAlpha is a number and costs nothing to set. */
  /* One pass, oldest first. The bucket index changes rarely — age advances
     monotonically and timbre moves slowly — so fillStyle is set a handful of
     times a frame rather than once per sample, without the nested loop over
     buckets that would cost 256 passes over the trail. */
  let lastBucket = -1;
  for (let k = 0; k < trail.n; k++) {
    const idx = (trail.head - trail.n + k + trail.cap) % trail.cap;
    const u = trail.n > 1 ? k / (trail.n - 1) : 1;
    const tb = Math.min(TRAIL_TB - 1, Math.max(0, Math.floor(trail.C[idx] * TRAIL_TB)));
    const ab = Math.min(TRAIL_AB - 1, Math.floor(u * TRAIL_AB));
    const bucket = tb * TRAIL_AB + ab;
    if (bucket !== lastBucket) { cx.fillStyle = TRAILLUT[bucket]; lastBucket = bucket; }
    cx.beginPath(); cx.arc(px(trail.L[2 * idx]), py(trail.L[2 * idx + 1]), 1.5, 0, 7); cx.fill();
    /* R is the same colour, dimmer. The two voices are one timbre at two
       points, and separate hues said they were two different sounds. */
    if (tel.stereo) {
      cx.globalAlpha = 0.55;
      cx.beginPath(); cx.arc(px(trail.R[2 * idx]), py(trail.R[2 * idx + 1]), 1.5, 0, 7); cx.fill();
      cx.globalAlpha = 1;
    }
  }
  cx.globalAlpha = 1;
  /* control frame (before rotation), faint cross */
  const cxp = px(clamp01(tel.ctl[ax])), cyp = py(clamp01(tel.ctl[ay]));
  const cross = () => { cx.beginPath(); cx.moveTo(cxp - 6, cyp); cx.lineTo(cxp + 6, cyp); cx.moveTo(cxp, cyp - 6); cx.lineTo(cxp, cyp + 6); };
  cx.lineWidth = 2.5; cx.strokeStyle = 'rgba(7,9,12,0.7)'; cross(); cx.stroke();
  cx.lineWidth = 1; cx.strokeStyle = 'rgba(232,238,244,0.5)'; cross(); cx.stroke();
  /* The dots.
   *
   * Everything here now sits on a dark under-stroke and a light rim. The dot
   * is drawn on top of terrain whose colour it shares by construction, so
   * over any cell close to its own value it had been disappearing — the one
   * mark that must never be lost. The two strokes are achromatic, so the
   * contrast does not depend on the colour either carries. */
  const r = sizeOf(tel.payload);
  const halo = (path) => {
    cx.lineWidth = 2.5; cx.strokeStyle = 'rgba(7,9,12,0.85)'; path(); cx.stroke();
    cx.lineWidth = 1.2; cx.strokeStyle = '#e8eef4'; path(); cx.stroke();
    cx.lineWidth = 1;
  };
  if (tel.stereo) {
    const connector = () => { cx.beginPath(); cx.moveTo(px(tel.posL[ax]), py(tel.posL[ay])); cx.lineTo(px(tel.posR[ax]), py(tel.posR[ay])); };
    cx.lineWidth = 2.5; cx.strokeStyle = 'rgba(7,9,12,0.7)'; connector(); cx.stroke();
    cx.lineWidth = 1; cx.strokeStyle = 'rgba(232,238,244,0.45)'; connector(); cx.stroke();
    /* R is the same colour as L, drawn as a ring rather than a disc: the
       voices differ in where they are, not in what they sound like, so the
       difference belongs in the shape and not in the hue. */
    const ring = () => { cx.beginPath(); cx.arc(px(tel.posR[ax]), py(tel.posR[ay]), r, 0, 7); };
    ring(); cx.lineWidth = 2.5; cx.strokeStyle = 'rgba(7,9,12,0.85)'; cx.stroke();
    ring(); cx.lineWidth = 1.5; cx.strokeStyle = dotColour(tv, 1); cx.stroke();
    cx.lineWidth = 1;
  }
  const disc = () => { cx.beginPath(); cx.arc(px(tel.posL[ax]), py(tel.posL[ay]), r, 0, 7); };
  halo(disc);
  cx.fillStyle = dotColour(tv, 1); disc(); cx.fill();
  drawFold(tel, n, ox, oy, S, px, py);
  drawKepler(tel, n, ox, oy, S, px, py);
  cx.fillStyle = '#9aa7b3'; cx.font = '11px ui-monospace, monospace';
  /* The trail no longer covers a fixed ten seconds, so it has to say what it
     does cover, or its length means nothing. */
  /* Top-left, and terse. It used to sit at ox + S - 150, where the long form
     ran about 186px at 10px monospace: 36px off the right edge of the box and
     straight under the Kepler inset, which occupies the top-right corner
     whenever a body is falling. */
  if (trail.n > 8) {
    const secs = trail.n * trail.gap / blockHz;
    /* Eight samples per turn of the fastest plane is where its shape stops
       being recoverable from the dots. Below that the trail is a strobe
       picture and says so, rather than drawing a confident lie. */
    const strobed = trail.fast > 0 && blockHz / trail.gap < 8 * trail.fast;
    const lbl = 'trail ' + (secs < 90 ? secs.toFixed(secs < 10 ? 1 : 0) + ' s' : (secs / 60).toFixed(1) + ' min');
    cx.fillStyle = strobed ? '#ff9a5c' : '#869cb1';
    cx.font = '10px ui-monospace, monospace';
    cx.fillText(strobed ? lbl + ' · strobed' : lbl, ox + 8, oy + 14);
    cx.font = '11px ui-monospace, monospace'; cx.fillStyle = '#9aa7b3';
  }
  cx.fillText(`${tel.stereo ? 'L' : 'pos'} ${fmtVec(tel.posL)}`, ox + 6, oy + S - (tel.stereo ? 20 : 8));
  if (tel.stereo) cx.fillText(`R ${fmtVec(tel.posR)}`, ox + 6, oy + S - 8);
  drawArcs(n, planes, tel, ox, oy + S + 18, S);
}
/* Imported nodes, where they are and which one the hand is on.
 *
 * In the play view this layer is drawn before the trail and the dot, and
 * deliberately so: it is setup, and the one mark that must never be lost is
 * where the instrument actually is. Rings rather than discs, in the panel's
 * own amber, so they read as "things you placed" against a dot that takes its
 * colour from the timbre.
 *
 * A node fades with its distance from the slice on screen. Two of its four
 * axes are not on this square, and without the fade a node sitting a long way
 * off in the axes you cannot see looks exactly like one under your hand —
 * which is the projection lying about a space whose whole point is that it has
 * more directions than a screen. Faded is the honest way to say "this is over
 * there"; the inspector says how far.
 *
 * Names only when there are few enough to be readable, plus always the
 * selected one. Twenty-four labels on a square is not a placement view, it is
 * a wall of text. */
function drawNodes(g, b, nodes, { dim = 1, labels = true, sel = -1 } = {}) {
  if (!nodes || !nodes.length) return;
  const named = labels && nodes.length <= 8;
  g.font = '10px ui-monospace, monospace';
  for (let i = 0; i < nodes.length; i++) {
    const w = nodes[i], sel_ = i === sel;
    /* A node has no coordinate on an axis it does not have, so it is not
       anywhere on this square and drawing it at the origin would be a lie. */
    if (b.ax >= w.pos.length || b.ay >= w.pos.length) continue;
    const x = boxX(b, w.pos[b.ax]), y = boxY(b, w.pos[b.ay]);
    const near = Math.max(0.18, 1 - Math.min(1, offPlane(w, b) / 0.5));
    const r = b.S < 140 ? 3.5 : 5;
    g.globalAlpha = dim * (sel_ ? 1 : near);
    g.beginPath(); g.arc(x, y, sel_ ? r + 2 : r, 0, 7);
    g.lineWidth = 2.5; g.strokeStyle = 'rgba(7,9,12,0.85)'; g.stroke();
    g.lineWidth = sel_ ? 1.8 : 1.2; g.strokeStyle = sel_ ? '#ffe9a8' : '#ffcc55'; g.stroke();
    g.lineWidth = 1;
    /* A dot in the middle of the selected one, so it is still findable when it
       is sitting on top of the position dot. */
    if (sel_) { g.beginPath(); g.arc(x, y, 1.6, 0, 7); g.fillStyle = '#ffe9a8'; g.fill(); }
    if ((named || sel_) && b.S >= 140) {
      const t = w.name.length > 12 ? w.name.slice(0, 11) + '…' : w.name;
      g.lineWidth = 3; g.strokeStyle = 'rgba(7,9,12,0.75)'; g.strokeText(t, x + 9, y + 3);
      g.fillStyle = sel_ ? '#ffe9a8' : '#c8a24a'; g.fillText(t, x + 9, y + 3);
      g.lineWidth = 1;
    }
  }
  g.globalAlpha = 1;
  g.font = '11px ui-monospace, monospace';
}

/* ── the build view ──────────────────────────────────────────────────────
 *
 * Playing and building are different jobs and were sharing one picture. The
 * space pane is a readout: everything in it comes from the module and moves
 * because the module moved. Placement is the opposite — nothing in it is true
 * yet, the whole point is to change it, and it wants room to say what a
 * waveform *is* rather than a ring on somebody else's terrain.
 *
 * So: two tabs. Play is the instrument. Build is a set of waveforms, where
 * each one sits in the space, and what the module will actually make of it.
 * The axis pair is shared between them, because which plane you are looking at
 * is a fact about the space rather than about which tab is open.
 */
const CYC = 512;                 /* points per drawn cycle: plenty at 64 harmonics */

/* What the module will render for this node.
 *
 * Sine phase and signed coefficients, which is exactly what a user world
 * declares (`sinePhase: true` in the blob), so this is not an impression of
 * the sound — it is the waveform the engine builds when Morph locks onto that
 * vertex. Worth drawing precisely because it is the part import throws away:
 * a node is a projection onto the sine basis, and what did not survive is only
 * visible by putting the two side by side.
 *
 * Negated, and that is not a detail. `RenderFrame` sums mag·cos(hθ + φ), and
 * for a sine-phase world the engine's φ makes that −sin(hθ) — checked against
 * the module rather than assumed: a user world of known coefficients sent to
 * kykdesk comes back correlating 1.0000 at shift 0 and *negative* polarity
 * against this sum. The first version of this function had the sign the other
 * way, so the inspector drew the rendered trace mirrored against the imported
 * one and every fit looked worse than it was. Inaudible on its own — a global
 * polarity flip always is — and wrong on screen, which is where this is used. */
function renderFromMags(mags, out = CYC) {
  const y = new Float32Array(out);
  for (let h = 0; h < mags.length; h++) {
    const a = mags[h];
    if (!a) continue;
    const w = 2 * Math.PI * (h + 1) / out;
    for (let i = 0; i < out; i++) y[i] -= a * Math.sin(w * i);
  }
  return y;
}

/* The cycle as imported, turned to line up with what came out.
 *
 * cycleToNode searches for the rotation of the cycle that keeps the most
 * energy on the sine basis, so the node describes the *shifted* wave. Drawing
 * the unshifted original against it would show two waveforms out of step and
 * blame the projection for it — the comparison is only honest once they start
 * at the same place. */
function rotatedCycle(cyc, rot, out = CYC) {
  const N = cyc.length, y = new Float32Array(out);
  /* Negated, for the same reason renderFromMags is: the engine plays
     -sum m.sin(h.theta), so a trace drawn in the file's own polarity would sit
     against the rendered one as its mirror image and every comparison would
     read as a total loss. Both traces are drawn in the polarity the instrument
     plays. A global sign flip is inaudible; comparing across one is not.
     This is what the first version of the polarity fix got wrong — it flipped
     one side of the comparison and left the other, which moved the mirror
     rather than removing it. */
  for (let i = 0; i < out; i++) y[i] = -cyc[(Math.round(i * N / out) + rot) % N];
  return y;
}

const peakOf = (a) => { let m = 0; for (const v of a) { const x = Math.abs(v); if (x > m) m = x; } return m; };

/* One waveform, as a line. `norm` is passed in rather than measured per trace
   so the imported and rendered cycles are drawn to the same scale: the
   rendered one is genuinely smaller when the projection dropped something, and
   normalising each to its own peak would hide exactly that. */
function tracePath(g, y, x0, y0, w, h, norm, colour, width) {
  const mid = y0 + h / 2, amp = (h / 2 - 1) / (norm || 1);
  g.beginPath();
  for (let i = 0; i < y.length; i++) {
    const px = x0 + (i / (y.length - 1)) * w, py = mid - y[i] * amp;
    if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
  }
  g.strokeStyle = colour; g.lineWidth = width; g.stroke(); g.lineWidth = 1;
}

/* ── the strip: what you imported, drawn ───────────────────────────────── */
function renderStrip() {
  const el = $('strip');
  el.innerHTML = '';
  if (!imported.length) {
    const d = document.createElement('div');
    d.className = 'empty';
    d.textContent = 'no waveforms yet — add single-cycle wavs and they become the nodes of a world';
    el.appendChild(d);
    return;
  }
  imported.forEach((w, i) => {
    const card = document.createElement('div');
    card.className = 'card' + (i === place.sel ? ' on' : '');
    const cv = document.createElement('canvas');
    cv.width = 196; cv.height = 64;          /* 2x for the usual screens */
    const g = cv.getContext('2d');
    g.clearRect(0, 0, 196, 64);
    if (w.render) tracePath(g, w.render, 3, 2, 190, 60, peakOf(w.render), i === place.sel ? '#ffe9a8' : '#8b98a6', 2);
    const nm = document.createElement('div');
    nm.className = 'cn'; nm.textContent = w.name; nm.title = w.name;
    /* Taking one out, without clearing the lot.
     *
     * The only way to drop a single wave was to clear everything and re-import,
     * which for a twenty-four node set is a punishment for changing your mind
     * about one of them. */
    const x = document.createElement('button');
    x.className = 'cx'; x.textContent = '×';
    x.title = 'take this one out';
    x.onclick = (e) => { e.stopPropagation(); removeNode(i); };
    card.appendChild(x);
    const ft = document.createElement('div');
    /* The fit is the fraction of the wave that survived projection onto the
       sine basis. Naming it per card rather than reporting the worst of the
       set is the difference between "something did not fit" and knowing which
       one to reconsider. */
    ft.className = 'cf' + (w.fit < 0.8 ? ' poor' : '');
    ft.textContent = w.mode === 'spectrum' ? 'spectrum' : `keeps ${(100 * w.fit).toFixed(0)}%`;
    card.appendChild(cv); card.appendChild(nm); card.appendChild(ft);
    card.onclick = () => selectNode(i);
    el.appendChild(card);
  });
}

/* ── the placement squares ─────────────────────────────────────────────── */
function drawPlaneBox(b, inset) {
  cpx.fillStyle = inset ? '#0a0e13' : '#080b0f';
  cpx.fillRect(b.ox, b.oy, b.S, b.S);
  cpx.strokeStyle = inset ? '#22303d' : '#1b232c';
  cpx.strokeRect(b.ox + .5, b.oy + .5, b.S, b.S);
  /* the centre lines, which are where an unplaced axis sits */
  cpx.strokeStyle = '#141b23';
  cpx.beginPath();
  cpx.moveTo(b.ox, boxY(b, 0.5)); cpx.lineTo(b.ox + b.S, boxY(b, 0.5));
  cpx.moveTo(boxX(b, 0.5), b.oy); cpx.lineTo(boxX(b, 0.5), b.oy + b.S);
  cpx.stroke();
  cpx.font = '10px ui-monospace, monospace';
  cpx.fillStyle = inset ? '#869cb1' : '#8b98a6';
  cpx.fillText(`${b.ax}×${b.ay}`, b.ox + 5, b.oy + 12);
}

function drawPlane() {
  const { w: W, h: H } = boxOf(cp);
  fit(cp);
  planeBoxes.length = 0;
  const n = tel ? tel.n : 4, m = 26;
  const S = Math.max(60, Math.min(W - 2 * m, H - 2 * m));
  const ox = (W - S) / 2, oy = m + (H - 2 * m - S) / 2;
  const main = { ax: axes[0], ay: axes[1], ox, oy, S };
  planeBoxes.push(main);
  drawPlaneBox(main, false);

  /* Where the module is standing, faint. Not the subject here — this view is
     about a world that may not even be loaded — but knowing whether the
     position is anywhere near the node you are moving is the difference
     between placing blind and placing while listening. */
  if (tel && tel.posL && main.ax < tel.posL.length && main.ay < tel.posL.length) {
    const x = boxX(main, tel.posL[main.ax]), y = boxY(main, tel.posL[main.ay]);
    cpx.strokeStyle = 'rgba(98,213,255,0.45)';
    cpx.beginPath();
    cpx.moveTo(x - 5, y); cpx.lineTo(x + 5, y); cpx.moveTo(x, y - 5); cpx.lineTo(x, y + 5);
    cpx.stroke();
  }
  drawNodes(cpx, main, imported, { sel: place.sel });

  /* The complementary plane, in the corner and live. Placement is one plane at
     a time by design, but until this existed the two axes you were not on were
     pure guesswork: you had to switch the pair, look, and switch back. With
     four dimensions the complement is unique, so these two squares between
     them show every axis there is, and a node is finished in one view. */
  const other = otherAxes(n);
  if (other) {
    const iS = Math.max(56, Math.min(132, S * 0.32));
    const b = { ax: other[0], ay: other[1], ox: ox + S - iS - 10, oy: oy + S - iS - 10, S: iS };
    planeBoxes.push(b);
    drawPlaneBox(b, true);
    drawNodes(cpx, b, imported, { labels: false, sel: place.sel });
  }

  cpx.font = '11px ui-monospace, monospace';
  cpx.fillStyle = '#6b819d';
  if (!imported.length)
    cpx.fillText('nothing to place yet', ox + 10, oy + S - 10);
  else if (place.sel < 0)
    cpx.fillText('drag a ring to move it · click one to inspect it', ox + 10, oy + S - 10);
}

/* ── the inspector: what you gave it against what it will play ─────────── */
function drawInspect() {
  const { w: W, h: H } = boxOf(ci);
  fit(ci);
  cix.font = '11px ui-monospace, monospace';
  const m = 12, w = imported[place.sel];
  if (!w) {
    cix.fillStyle = '#6b819d';
    const lines = imported.length
      ? ['pick a waveform', '', `${imported.length} node${imported.length > 1 ? 's' : ''} in "${worldName()}"`,
         place.sent ? 'the module is holding this set' : 'not sent to the module']
      : ['a world is up to 24 single cycles', 'placed in a 4-dimensional space', '',
         'add wavs to begin'];
    lines.forEach((t, i) => cix.fillText(t, m, 28 + i * 16));
    return;
  }
  cix.fillStyle = '#ffe9a8';
  cix.fillText(w.name.length > 26 ? w.name.slice(0, 25) + '…' : w.name, m, 20);

  const bw = W - 2 * m;
  const waveY = 32, waveH = Math.max(50, Math.min(110, H * 0.26));
  cix.strokeStyle = '#1b232c'; cix.strokeRect(m + .5, waveY + .5, bw, waveH);
  cix.strokeStyle = '#141b23';
  cix.beginPath(); cix.moveTo(m, waveY + waveH / 2); cix.lineTo(m + bw, waveY + waveH / 2); cix.stroke();
  const norm = Math.max(w.thumb ? peakOf(w.thumb) : 0, w.render ? peakOf(w.render) : 0) || 1;
  if (w.thumb) tracePath(cix, w.thumb, m, waveY, bw, waveH, norm, '#77889e', 1);
  if (w.render) tracePath(cix, w.render, m, waveY, bw, waveH, norm, '#ffcc55', 1.6);
  cix.fillStyle = '#77889e'; cix.fillText('imported', m + 4, waveY + waveH - 6);
  cix.fillStyle = '#ffcc55'; cix.fillText('rendered', m + 70, waveY + waveH - 6);

  /* The spectrum the node actually is: 64 signed coefficients on the sine
     basis. Signed, so the sign is drawn rather than dropped — it is half of
     what makes a saw a saw rather than a spectrum that merely measures like
     one, and the whole reason the format stores f32 and not magnitudes. */
  const specY = waveY + waveH + 24, specH = Math.max(40, Math.min(110, H * 0.24));
  cix.fillStyle = '#869cb1'; cix.fillText('spectrum', m, specY - 8);
  cix.strokeStyle = '#1b232c'; cix.strokeRect(m + .5, specY + .5, bw, specH);
  const mid = specY + specH / 2;
  cix.strokeStyle = '#141b23';
  cix.beginPath(); cix.moveTo(m, mid); cix.lineTo(m + bw, mid); cix.stroke();
  const mags = w.mags, peak = peakOf(mags) || 1, bwid = bw / mags.length;
  for (let h = 0; h < mags.length; h++) {
    const v = mags[h] / peak, x = m + h * bwid, hh = Math.abs(v) * (specH / 2 - 2);
    cix.fillStyle = v >= 0 ? '#ffcc55' : '#62d5ff';
    cix.fillRect(x + 0.5, v >= 0 ? mid - hh : mid, Math.max(1, bwid - 1), Math.max(0.8, hh));
  }

  let ty = specY + specH + 20;
  const line = (t, c) => { cix.fillStyle = c || '#8b98a6'; cix.fillText(t, m, ty); ty += 15; };
  /* What the two traces above mean, which depends on how it was imported. In
     spectrum mode the magnitudes are kept and the phase is thrown away on
     purpose, so the waveform differing is the mode working rather than a loss
     worth reporting as one. */
  if (w.mode === 'captured')
    line('captured from the module · no imported cycle to compare against', '#869cb1');
  else if (w.mode === 'spectrum')
    line('spectrum kept exactly · the waveform is redrawn at sine phase', '#869cb1');
  else
    line(`keeps ${(100 * w.fit).toFixed(1)}% of the wave`, w.fit < 0.8 ? '#ff9a5c' : '#8b98a6');
  line(`at ${[...w.pos].map(v => v.toFixed(2)).join('  ')}`);
  const b = planeBoxes[0];
  if (b) {
    const off = offPlane(w, b);
    if (off > 0.02) line(`${off.toFixed(2)} off the ${b.ax}×${b.ay} slice`, '#869cb1');
  }
  if (w.fit < 0.8 && w.mode !== 'spectrum')
    line('a node is a projection onto the sine basis;', '#869cb1'), line('what sat in the cosine half is gone', '#869cb1');
}

/* ── hearing what import costs ────────────────────────────────────────────
 *
 * The corpus measurement is in energy, and energy is not audibility: a wave
 * keeping 77% of its energy does not sound 77% right, because what goes is the
 * phase relationship between partials. The only way to settle whether that
 * matters is to listen to the same wave three ways, so this plays all three at
 * once and switches between them.
 *
 *   as imported    the cycle from the file, every harmonic it has
 *   band-limited   the same cycle with everything above K discarded, which is
 *                  the ceiling any representation at this K has
 *   as rendered    what the module will actually make of it: the signed sine
 *                  coefficients the node stores, which is the imported cycle
 *                  with its cosine half thrown away
 *
 * Imported against band-limited is what the band limit costs. Band-limited
 * against rendered is what the *phase* costs, on its own, which is the number
 * the whole representation question turns on.
 *
 * All three are one cycle in a buffer of the same length, looped at rate 1.0:
 * no resampling, no pitch shift, nothing that treats one of them differently
 * from the others. They start together and stay sample-aligned, so switching
 * is instant and phase-locked rather than a restart you have to remember
 * across. The fundamental is whatever sampleRate/512 comes to, around 86 to 94
 * Hz — low on purpose, because that puts the most harmonics where you can hear
 * them.
 *
 * Levels are matched. The projection genuinely loses energy and the quieter of
 * two sounds is reliably judged the worse one, so comparing them at their own
 * levels would answer a different question than the one being asked. The gap
 * is printed instead.
 */
const audition = { ctx: null, gains: [], srcs: [], which: 2, node: -1 };

/* Everything above harmonic K, removed. Round trip through a DFT rather than a
   filter: the point is to be exactly the band limit and nothing else. */
function bandLimit(y, K) {
  const N = y.length, out = new Float32Array(N);
  for (let h = 1; h <= K; h++) {
    let re = 0, im = 0;
    for (let i = 0; i < N; i++) {
      const th = 2 * Math.PI * h * i / N;
      re += y[i] * Math.cos(th); im += y[i] * Math.sin(th);
    }
    re *= 2 / N; im *= 2 / N;
    for (let i = 0; i < N; i++) {
      const th = 2 * Math.PI * h * i / N;
      out[i] += re * Math.cos(th) + im * Math.sin(th);
    }
  }
  return out;
}
const rmsOf = (y) => { let s = 0; for (const v of y) s += v * v; return Math.sqrt(s / y.length); };

function auditionStop() {
  for (const s of audition.srcs) { try { s.stop(); } catch {} }
  audition.srcs = []; audition.gains = []; audition.node = -1;
  renderAudition();
}

function auditionStart() {
  const w = imported[place.sel];
  if (!w || !w.thumb || !w.render) return;
  auditionStop();
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { say('this browser has no Web Audio', true); return; }
    audition.ctx = audition.ctx || new AC();
  } catch (e) { say('audio: ' + e.message, true); return; }
  const ctx = audition.ctx;
  if (ctx.state === 'suspended') ctx.resume();
  const waves = [w.thumb, bandLimit(w.thumb, 64), w.render];
  const r = waves.map(rmsOf);
  const ref = r[0] || 1;
  audition.srcs = []; audition.gains = [];
  const t0 = ctx.currentTime + 0.08;          /* one start time for all three */
  const match = r.map(v => 0.25 * (ref / (v || ref)));
  waves.forEach((y, i) => {
    const buf = ctx.createBuffer(1, y.length, ctx.sampleRate);
    buf.copyToChannel(Float32Array.from(y), 0);
    const src = ctx.createBufferSource();
    src.buffer = buf; src.loop = true;
    const g = ctx.createGain();
    /* matched to the imported wave's level, so what you hear is timbre */
    g.gain.value = i === audition.which ? match[i] : 0;
    src.connect(g); g.connect(ctx.destination);
    src.start(t0);
    audition.srcs.push(src); audition.gains.push(g);
  });
  audition.node = place.sel;
  /* The matched gains, worked out once. Switching then only chooses which of
     them is open, so the levels cannot drift apart from the ones the state
     line is reporting. */
  audition.match = r.map(v => 0.25 * (ref / (v || ref)));
  audition.levels = r.map(v => 20 * Math.log10((v || 1e-9) / ref));
  renderAudition();
}

function auditionPick(i) {
  audition.which = i;
  audition.gains.forEach((g, j) => {
    /* A short ramp rather than a step. A hard gain switch clicks, and a click
       is precisely the artefact this exists to listen for — it would be heard
       as a property of whichever version you switched to. */
    g.gain.setTargetAtTime(j === i ? audition.match[j] : 0, audition.ctx.currentTime, 0.004);
  });
  renderAudition();
}

function renderAudition() {
  const w = imported[place.sel], live = audition.node >= 0;
  $('audPlay').disabled = !w || !w.thumb;
  $('audPlay').classList.toggle('on', live);
  $('audPlay').textContent = live ? 'stop' : 'audition';
  ['audA', 'audB', 'audC'].forEach((id, i) => {
    $(id).disabled = !live;
    $(id).classList.toggle('on', live && audition.which === i);
  });
  if (!w) { $('audState').textContent = 'pick a waveform to hear it'; return; }
  if (!live) { $('audState').textContent = `${w.name} — three ways, levels matched`; return; }
  const f0 = audition.ctx ? audition.ctx.sampleRate / CYC : 0;
  const drop = audition.levels ? audition.levels[2] : 0;
  $('audState').textContent =
    `${imported[audition.node].name} at ${f0.toFixed(1)} Hz · rendered sits ${drop.toFixed(1)} dB down, matched here`;
}
renderAudition();
$('audPlay').onclick = () => (audition.node >= 0 ? auditionStop() : auditionStart());
$('audA').onclick = () => auditionPick(0);
$('audB').onclick = () => auditionPick(1);
$('audC').onclick = () => auditionPick(2);

/* ── the worlds tab: a library of what the module is holding ──────────────
 *
 * The gap this closes was not on the page. A world you imported could be
 * played and could never be *returned to*: a transfer replaced whatever was
 * live, and the morph target index space was the twenty-one built-ins, so your
 * own worlds could never be one end of a blend. The module has thirty-two slots
 * now (blobs in SDRAM, expanded on demand) and this is the view of them.
 *
 * What the page knows and does not know: the module reports which slots are
 * filled, their names, which is playing and which is the target. It does not
 * report what is *in* one — there is no command for that and a slot is 6.5 KB
 * — so the node positions the play view draws are only known for slots this
 * page put there itself. A slot filled in an earlier session is playable and
 * its rings are not drawn, which is the honest answer rather than a guess.
 */
/* The library is every world there is: the twenty-two that ship, then yours.
 *
 * It used to be thirty-two empty slots, which on a fresh module is a grid of
 * nothing and reads as broken. The built-ins were in a chip row on the play tab
 * and the slots were here, so "the list of worlds" existed in two places and
 * neither was the list. One grid, one selection, one set of verbs — play it,
 * morph towards it, open it to edit — and only the ones that are yours can also
 * be forgotten or written to the card.
 */
let slots = null, slotDrag = -1;
let libSel = null;                 /* { kind: 'builtin' | 'slot', i } */
const slotNodes = {};              /* slot -> [{ name, pos }], only what we sent */

const libIsSel = (kind, i) => !!libSel && libSel.kind === kind && libSel.i === i;
const slotFilled = (i) => !!(slots && slots.names[i]);

async function refreshSlots() {
  if (!link) { slots = null; renderLibrary(); return; }
  try { slots = await MVL.fetchSlots(link); } catch { slots = null; }
  renderLibrary();
  renderLib();
}

/* One tile, whichever kind it is. The differences are what it is called, what
   badges it carries, and whether it can be dragged. */
function libTile(kind, i, name, note) {
  const el = document.createElement('div');
  const empty = kind === 'slot' && !name;
  el.className = 'slot' + (empty ? ' empty' : '') + (libIsSel(kind, i) ? ' on' : '')
               + (kind === 'builtin' ? ' builtin' : '');
  const num = document.createElement('div');
  num.className = 'sn';
  num.textContent = kind === 'builtin' ? 'BUILT IN' : String(i).padStart(2, '0');
  const nm = document.createElement('div');
  nm.className = 'snm';
  nm.textContent = name || 'empty';
  nm.title = note || name || 'empty — drop a .kykw here, or add one from the build tab';
  const badge = document.createElement('div');
  badge.className = 'sb';
  const live = kind === 'builtin' ? (worlds && worlds.current === i && slots && slots.live === 0xFF)
                                  : (slots && slots.live === i);
  const tgt  = kind === 'builtin' ? (tel && tel.morphWorld === i)
                                  : (slots && slots.target === i);
  if (live) { const b = document.createElement('span'); b.className = 'live'; b.textContent = 'playing'; badge.appendChild(b); }
  if (tgt) {
    if (badge.firstChild) badge.appendChild(document.createTextNode(' '));
    const b = document.createElement('span'); b.className = 'tgt'; b.textContent = 'target'; badge.appendChild(b);
  }
  el.appendChild(num); el.appendChild(nm); el.appendChild(badge);
  el.onclick = () => { libSel = { kind, i }; renderLibrary(); renderLib(); renderTour(); };
  if (kind === 'slot') {
    if (name) {
      el.draggable = true;
      el.addEventListener('dragstart', e => {
        slotDrag = i;
        if (e.dataTransfer) { e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(i)); } catch {} }
      });
      el.addEventListener('dragend', () => { slotDrag = -1; });
    }
    el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('drop'); });
    el.addEventListener('dragleave', () => el.classList.remove('drop'));
    el.addEventListener('drop', async e => {
      e.preventDefault(); el.classList.remove('drop');
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) { await storeFile(i, f); return; }
      if (slotDrag >= 0 && slotDrag !== i) await swapSlots(slotDrag, i);
      slotDrag = -1;
    });
  }
  return el;
}

function renderLibrary() {
  const box = $('slots');
  box.innerHTML = '';
  const head = (text) => {
    const h = document.createElement('div');
    h.className = 'libhead'; h.textContent = text;
    box.appendChild(h);
  };
  head(worlds ? `the ${worlds.count} that ship` : 'the worlds that ship');
  if (worlds) for (const w of worlds.list) box.appendChild(libTile('builtin', w.index, w.name, w.note));
  head(slots ? `yours — ${slots.names.filter(Boolean).length} of ${slots.count}` : 'yours');
  const n = slots ? slots.count : MVL.SLOT_COUNT;
  for (let i = 0; i < n; i++) box.appendChild(libTile('slot', i, slots ? slots.names[i] : null, null));
}

/* Exchange two slots. The module does it, because the page does not have the
   blob for a slot it did not put there — it knows the name and nothing else.
   What is playing is an expanded copy, so a swap cannot reach the audio. */
async function swapSlots(a, b) {
  if (!link) return;
  try {
    await link.request(MVL.CMD.action, MVL.actionReq(MVL.ACT.slotSwap, [a & 0xff, b & 0xff]), { urgent: true });
    const na = slotNodes[a], nb = slotNodes[b];
    if (nb) slotNodes[a] = nb; else delete slotNodes[a];
    if (na) slotNodes[b] = na; else delete slotNodes[b];
    if (libIsSel('slot', a)) libSel = { kind: 'slot', i: b };
    else if (libIsSel('slot', b)) libSel = { kind: 'slot', i: a };
    await refreshSlots();
  } catch (e) { say('swap: ' + e.message, true); }
}

async function storeFile(slot, file) {
  if (!link) { say('connect a module to store a world', true); return; }
  try {
    const bytes = new Uint8Array(await file.arrayBuffer());
    const w = MVL.parseUserWorld(bytes);
    if (!w) { say(`${file.name} is not a .kykw world`, true); return; }
    await MVL.putSlot(link, slot, bytes, (d, a) => say(`storing ${(100 * d / a).toFixed(0)}%`));
    slotNodes[slot] = w.nodes.map((nd, i) => ({ name: w.name ? `${w.name} ${i}` : String(i), pos: nd.pos.slice() }));
    say(`${w.name || file.name} in slot ${slot} — ${w.count} node${w.count > 1 ? 's' : ''}`);
    await refreshSlots();
  } catch (e) { say('store: ' + e.message, true); }
}

/* The first slot with nothing in it, which is what "add to worlds" needs so
   nobody has to pick a number. */
function freeSlot() {
  if (!slots) return -1;
  return slots.names.findIndex(n => !n);
}

/* Keep the build set. The verb lives on the build tab because that is where you
   made the thing — having to change tabs, find a slot by number and press a
   button that refers to "the build set" was the flow that was broken. */
async function keepBuildSet() {
  if (!link || !imported.length) return;
  try {
    await refreshSlots();
    const slot = freeSlot();
    if (slot < 0) { say('every slot is full — forget one on the worlds tab', true); return; }
    const blob = importedBlob();
    await MVL.putSlot(link, slot, blob, (d, a) => say(`keeping ${(100 * d / a).toFixed(0)}%`));
    slotNodes[slot] = imported.map(w => ({ name: w.name, pos: w.pos.slice() }));
    say(`${worldName()} is now in your worlds, slot ${slot}`);
    await refreshSlots();
  } catch (e) { say('add: ' + e.message, true); }
}

/* Play whatever is selected, whichever kind it is. */
async function libPlay() {
  if (!link || !libSel) return;
  try {
    if (libSel.kind === 'builtin') { heldLost(); await selectWorld(libSel.i); }
    else await slotAction(MVL.ACT.slotLive, libSel.i);
    await refreshSlots();
  } catch (e) { say('play: ' + e.message, true); }
}

/* Morph towards whatever is selected. Built-ins go through the world-index
   path, yours through the slot path — two commands, one verb, because "what am
   I blending towards" is one question. */
async function libTargetSel(clear) {
  if (!link) return;
  try {
    if (clear) {
      await link.request(MVL.CMD.action, MVL.actionReq(MVL.ACT.morphWorld, [0xFF]), { urgent: true });
      await link.request(MVL.CMD.action, MVL.actionReq(MVL.ACT.slotTarget, [0xFF]), { urgent: true });
    } else if (!libSel) return;
    else if (libSel.kind === 'builtin')
      await link.request(MVL.CMD.action, MVL.actionReq(MVL.ACT.morphWorld, [libSel.i]), { urgent: true });
    else
      await link.request(MVL.CMD.action, MVL.actionReq(MVL.ACT.slotTarget, [libSel.i]), { urgent: true });
    await refreshSlots();
    renderMorphSel();
  } catch (e) { say('target: ' + e.message, true); }
}

async function slotAction(op, slot) {
  if (!link) return;
  try {
    await link.request(MVL.CMD.action, MVL.actionReq(op, [slot & 0xff]), { urgent: true });
    if (op === MVL.ACT.slotLive) {
      const known = slotNodes[slot];
      if (known) held = { name: (slots && slots.names[slot]) || 'slot ' + slot, nodes: known.map(k => ({ name: k.name, pos: k.pos.slice() })) };
      else heldLost();
      place.sent = false;
      renderImport();
    }
    await refreshSlots();
  } catch (e) { say('slot: ' + e.message, true); }
}

function renderLib() {
  renderLibCardSel();
  const sel = libSel;
  const mine = sel && sel.kind === 'slot' && slotFilled(sel.i);
  const any = sel && (sel.kind === 'builtin' || mine);
  $('libPlay').disabled = !link || !any;
  $('libTarget').disabled = !link || !any;
  $('libEdit').disabled = !link || !any;
  $('libFree').disabled = !link || !mine;
  $('libSave').disabled = !link || !mine;
  $('libNoTarget').disabled = !link;
  $('libLoad').disabled = !link || !(cardList.names || []).length || !sel || sel.kind !== 'slot';
  $('libRescan').disabled = !link;
  if (!link) { $('libState').textContent = 'connect a module to see its worlds'; return; }
  if (!sel) { $('libState').textContent = 'pick a world — anything here can be played, morphed towards, or opened to edit'; return; }
  if (sel.kind === 'builtin') {
    const w = worlds && worlds.list.find(x => x.index === sel.i);
    $('libState').textContent = w ? `${w.name} — ${w.note}` : 'a world that ships';
  } else if (mine) {
    $('libState').textContent = `slot ${sel.i}: ${slots.names[sel.i]}`
      + (slotNodes[sel.i] ? '' : ' (nodes unknown — stored elsewhere)');
  } else {
    $('libState').textContent = `slot ${sel.i} is empty — drop a .kykw on it, or add one from the build tab`;
  }
}

/* ── the loop ──────────────────────────────────────────────────────────────
 *
 * A row of stops the clock walks, built out of the library below it. The list is
 * the module's, not the page's: every change is sent and then read back, and the
 * live position comes from telemetry — because the clock moves the loop on and a
 * row drawn from what the page last programmed would be the one thing on screen
 * that the module has already left behind. The module also stops the loop when a
 * world is chosen by hand, so "what I sent" and "what it is doing" part company
 * for real reasons rather than hypothetical ones.
 *
 * Stops are named the way the wire names them: a built-in index, or 0x80 | slot
 * for one of yours.
 */
const TOUR_DIVS = [1, 2, 3, 4, 6, 8, 12, 16];
let tourStops = [];      /* what the module says it is walking */
let tourDiv = 1;
let tourLive = { len: 0, at: 0, blend: 0 };

function tourName(code) {
  if (code & 0x80) {
    const s = code & 0x7f;
    return (slots && slots.names[s]) || ('slot ' + s);
  }
  const w = worlds && worlds.list.find(x => x.index === code);
  return w ? w.name : ('world ' + code);
}
function buildTourDiv() {
  const sel = $('tourDiv');
  sel.innerHTML = '';
  for (const d of TOUR_DIVS) {
    const o = document.createElement('option');
    o.value = String(d); o.textContent = String(d);
    sel.appendChild(o);
  }
  sel.value = String(tourDiv);
  sel.onchange = () => { tourDiv = Number(sel.value) || 1; if (tourStops.length >= 2) sendTour(tourStops); };
}
function renderTour() {
  const box = $('tourStops');
  box.innerHTML = '';
  tourStops.forEach((code, i) => {
    if (i) { const a = document.createElement('span'); a.className = 'ar'; a.textContent = '→'; box.appendChild(a); }
    const el = document.createElement('span');
    el.className = 'ts' + (tourLive.len && i === tourLive.at ? ' live'
                           : tourLive.len && i === (tourLive.at + 1) % tourStops.length ? ' next' : '');
    el.textContent = tourName(code);
    box.appendChild(el);
  });
  const sel = libSel;
  const can = !!link && !!sel && (sel.kind === 'builtin' || (sel.kind === 'slot' && slotFilled(sel.i)));
  $('tourAdd').disabled = !can || tourStops.length >= MVL.TOUR.max;
  $('tourDrop').disabled = !link || !tourStops.length;
  $('tourClear').disabled = !link || !tourStops.length;
  $('tourDiv').disabled = !link;
  if (!link) { $('tourState').textContent = ''; return; }
  if (tourStops.length < 2) {
    $('tourState').textContent = tourStops.length
      ? 'one stop is not a loop — add another'
      : 'pick a world below and add it: the clock on J2 walks the loop and the sound morphs between the stops';
    return;
  }
  /* The one thing worth saying unprompted, because it is audible and not
     obvious: a step between worlds that render the cycle differently is a
     switch rather than a morph. Shapes, Shapes R and Grit shape the rendered
     cycle, and the phase convention splits the rest in two. */
  const shaped = tourStops.filter(c => !(c & 0x80) && [11, 12, 21].includes(c)).length;
  const pct = Math.round(tourLive.blend * 100);
  $('tourState').textContent = tourLive.len
    ? `stop ${tourLive.at + 1} of ${tourLive.len}, ${pct}% towards the next`
      + (shaped ? ' · a stop that shapes the cycle steps rather than morphs' : '')
    : 'programmed — the loop moves when J2 clocks it, or wind up the World page\'s free-run knob';
}
async function readTour() {
  if (!link) { tourStops = []; renderTour(); return; }
  try {
    const t = MVL.parseTour(await link.request(MVL.CMD.tour, MVL.tourReq(MVL.TOUR.get)));
    if (t) { tourStops = t.entries; tourDiv = t.div || tourDiv; $('tourDiv').value = String(tourDiv); }
  } catch { /* an older module has no tour; leave the row empty */ }
  renderTour();
}
async function sendTour(stops) {
  if (!link) return;
  try {
    const t = MVL.parseTour(await link.request(MVL.CMD.tour, MVL.tourReq(MVL.TOUR.set, tourDiv, stops),
                                              { urgent: true }));
    if (t) tourStops = t.entries;
    /* The loop replaces what is playing, so the page's record of the world it
       sent is no longer what the module is holding. */
    if (stops.length >= 2) heldLost();
    renderTour();
  } catch (e) { say('loop: ' + e.message, true); }
}
function tourAdd() {
  if (!libSel) return;
  const code = libSel.kind === 'builtin' ? libSel.i : (0x80 | libSel.i);
  sendTour(tourStops.concat([code]));
}

function renderLibCardSel() {
  const sel = $('libCardSel');
  const keep = sel.selectedIndex;
  sel.innerHTML = '';
  for (const nm of cardList.names || []) {
    const o = document.createElement('option');
    o.value = nm; o.textContent = nm.replace(/\.kykw$/i, '');
    sel.appendChild(o);
  }
  if (keep >= 0 && keep < sel.children.length) sel.selectedIndex = keep;
  else if (sel.children.length) sel.selectedIndex = 0;
}

/* Saving one of yours to the card, and the one question worth interrupting for.
   The module refuses an overwrite that was not asked for, so this dialog is the
   only route to replacing a file and there is no path that does it quietly. */
function nextFreeName(base) {
  const taken = new Set((cardList.names || []).map(n => n.replace(/\.kykw$/i, '').toLowerCase()));
  if (!taken.has(base.toLowerCase())) return base;
  for (let i = 2; i < 100; i++) if (!taken.has(`${base}-${i}`.toLowerCase())) return `${base}-${i}`;
  return base + '-x';
}

async function saveSelectedToCard() {
  if (!link || !libSel || libSel.kind !== 'slot' || !slotFilled(libSel.i)) return;
  const slot = libSel.i;
  const base = (slots.names[slot] || ('slot' + slot)).replace(/[^A-Za-z0-9._-]+/g, '-').slice(0, 24) || ('slot' + slot);
  try {
    await MVL.saveCardWorld(link, slot, base, false);
    say(`${base}.kykw written to the card`);
  } catch (e) {
    if (!/already on the card/.test(e.message)) { say('save: ' + e.message, true); return; }
    const alt = nextFreeName(base);
    const ask = typeof confirm === 'function' ? confirm : () => false;
    const yes = ask(`${base}.kykw is already on the card.\n\n`
                  + `OK — replace it.\nCancel — save as ${alt}.kykw instead.`);
    try {
      if (yes) { await MVL.saveCardWorld(link, slot, base, true); say(`${base}.kykw replaced`); }
      else { await MVL.saveCardWorld(link, slot, alt, false); say(`${alt}.kykw written to the card`); }
    } catch (e2) { say('save: ' + e2.message, true); return; }
  }
  await refreshCard();
  renderLib();
}

async function loadCardIntoSlot() {
  if (!link || !libSel || libSel.kind !== 'slot') return;
  const i = $('libCardSel').selectedIndex;
  if (i < 0 || !cardList.names.length) return;
  try {
    await link.request(MVL.CMD.action, MVL.actionReq(MVL.ACT.cardToSlot, [i & 0xff, libSel.i & 0xff]), { urgent: true, timeoutMs: 4000 });
    /* The module parsed it; the page did not, so it does not know where the
       nodes are. Same rule as any slot filled elsewhere: it plays, and its
       rings stay undrawn rather than guessed. */
    delete slotNodes[libSel.i];
    say(`${cardList.names[i]} into slot ${libSel.i}`);
    await refreshSlots();
  } catch (e) { say('load: ' + e.message, true); }
}

  $('tabBuild').classList.toggle('on', m === 'build');
  $('tabLib').classList.toggle('on', m === 'worlds');

     muted — and none of it applies to a world that is not loaded yet. */

     until something measures it again. */

  /* Ask the module what it is holding when the tab opens, rather than polling
     a list that only changes when somebody changes it. */
