<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyklophoria</title>
<style>
  :root { --bg: #07090c; --ink: #cfd6dd; --dim: #5d6873; --line: #1a2028; --hot: #ffcc55; --l: #62d5ff; --r: #ff7a9e; --ok: #6ee7a0; --bad: #ff5c5c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.35 ui-monospace, "SF Mono", Menlo, Consolas, monospace; height: 100%; overflow: hidden; }
  body { display: grid; grid-template-rows: auto auto 1fr auto auto; height: 100vh; }
  header { display: flex; align-items: center; gap: 12px; padding: 6px 12px; border-bottom: 1px solid var(--line); }
  header .name { font-weight: 600; letter-spacing: .08em; color: var(--hot); }
  header .sp { flex: 1; }
  button { background: #0f141a; color: var(--ink); border: 1px solid #263039; border-radius: 3px; padding: 3px 9px; font: inherit; cursor: pointer; }
  button:hover { border-color: #3a4855; } button.on { border-color: var(--hot); color: var(--hot); }
  button:disabled { opacity: .4; cursor: default; }
  /* world strip: which space the module is indexing, and how the terrain is shaded */
  /* Two rows, not one wrapping row. With nine worlds the chips fitted beside
     the description and it read fine; at eighteen they wrap, and a single flex
     row wraps the description in among them — names and notes jumbled
     together. The list only grows, so the chips get a line of their own. */
  #worldbar { display: flex; flex-direction: column; gap: 3px; padding: 4px 12px;
              border-bottom: 1px solid var(--line); font-size: 11px; color: var(--dim); }
  #worldbar .wrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 20px; }
  #worldbar .cap { letter-spacing: .1em; flex: none; }
  #worldbar .sp { flex: 1; }
  #worldChips, #shadeChips { display: flex; gap: 6px; flex-wrap: wrap; }
  /* one line, clipped rather than pushing the row taller */
  #worldNote { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
               white-space: nowrap; font-style: italic; }
  #worldNote.peek { color: var(--ink); font-style: normal; }
  .chip { background: #0f141a; color: var(--dim); border: 1px solid #263039; border-radius: 3px;
          padding: 1px 8px; font: inherit; cursor: pointer; white-space: nowrap; }
  .chip:hover { border-color: #3a4855; color: var(--ink); }
  .chip.on { border-color: var(--hot); color: var(--hot); }
  .chip.analytic::after { content: " ƒ"; opacity: .75; }   /* has a formula */
  .chip:disabled { opacity: .45; cursor: default; }
  /* A select rather than a chip row: twenty-one worlds and an open-ended list
     of files are both too many to lay out flat, and a dropdown is the honest
     control for a long list. */
  #worldbar select { background: #0f141a; color: var(--ink); border: 1px solid #263039;
                     border-radius: 3px; padding: 1px 4px; font: inherit; max-width: 180px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 34%); gap: 0; min-height: 0; }
  .pane { position: relative; min-width: 0; min-height: 0; border-right: 1px solid var(--line); }
  .pane:last-child { border-right: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  .overlay { position: absolute; left: 10px; top: 8px; display: flex; gap: 4px; flex-wrap: wrap; }
  .overlay button { padding: 1px 6px; font-size: 11px; color: var(--dim); }
  .overlay button.on { color: var(--hot); }
  .label { position: absolute; right: 10px; top: 8px; color: var(--dim); font-size: 11px; letter-spacing: .1em; }
  footer { display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 5px 12px; border-top: 1px solid var(--line); color: var(--dim); font-size: 12px; }
  footer b { color: var(--ink); font-weight: 500; }
  footer .warn b { color: var(--bad); }
  #drawer { border-top: 1px solid var(--line); padding: 6px 12px; display: none; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 4px 18px; font-size: 11px; color: var(--dim); max-height: 34vh; overflow: auto; }
  #drawer.show { display: grid; }
  #drawer label { display: flex; align-items: center; gap: 8px; min-width: 0; }
  #drawer label span { flex: 0 0 72px; white-space: nowrap; overflow: hidden; }
  #drawer label output { flex: 0 0 68px; text-align: right; color: var(--ink); white-space: nowrap; }
  #drawer input[type=range] { flex: 1 1 60px; min-width: 60px; accent-color: var(--hot); height: 14px; margin: 0; }
  #drawer h4 { grid-column: 1 / -1; margin: 4px 0 0; font-weight: 500; color: var(--dim); font-size: 11px; letter-spacing: .1em; }
  #msg { color: var(--dim); }
</style>
</head>
<body>
<header>
  <span class="name">Kyklophoria</span>
  <span id="modinfo" style="color:var(--dim)">not connected</span>
  <span class="sp"></span>
  <span id="msg"></span>
  <button id="btnSerial">Serial</button>
  <button id="btnBridge">Bridge</button>
  <button id="btnDrawer" hidden>Controls</button>
  <button id="btnClose" hidden>Disconnect</button>
</header>
<nav id="worldbar">
  <div class="wrow">
    <span class="cap" id="worldCap">WORLD</span>
    <span id="worldChips"></span>
  </div>
  <div class="wrow">
    <span id="worldNote"></span>
    <span class="sp"></span>
    <span class="cap">SHADE</span>
    <span id="shadeChips"></span>
    <span class="sp"></span>
    <span class="cap">TAIL</span>
    <span id="trailChips"></span>
  </div>
  <div class="wrow">
    <span class="cap">MORPH</span>
    <select id="morphSel"><option value="255">off</option></select>
    <button class="chip" id="morphDirect">direct</button>
    <button class="chip" id="morphAim">aimed</button>
    <span id="morphState" style="color: var(--dim)"></span>
    <span class="sp"></span>
    <span class="cap">CARD</span>
    <select id="cardSel"></select>
    <button class="chip" id="cardLoad">load</button>
    <button class="chip" id="cardScan">rescan</button>
    <span id="cardState" style="color: var(--dim)"></span>
  </div>
  <div class="wrow">
    <span class="cap">IMPORT</span>
    <input type="file" id="wavIn" accept=".wav,audio/wav" multiple hidden>
    <button class="chip" id="wavPick">add wavs…</button>
    <button class="chip" id="wavMode">shape</button>
    <button class="chip" id="wavSend">send</button>
    <button class="chip" id="wavClear">clear</button>
    <span id="wavState" style="color: var(--dim)"></span>
  </div>
  <div class="wrow">
    <span class="cap">MOTION</span>
    <span id="muteChips"></span>
  </div>
</nav>
<main>
  <div class="pane">
    <canvas id="space"></canvas>
    <div class="overlay" id="axes"></div>
    <div class="label">SPACE</div>
  </div>
  <div class="pane">
    <canvas id="sound"></canvas>
    <div class="label">SOUND</div>
  </div>
</main>
<div id="drawer"></div>
<footer>
  <span>module <b id="sMod">—</b></span>
  <span>block <b id="sBlock">—</b></span>
  <span>f0 <b id="sF0">—</b></span>
  <span>kcut <b id="sKcut">—</b></span>
  <span>spread <b id="sSpread">—</b></span>
  <span>link <b id="sLink">—</b></span>
  <span id="sCpuWrap">cpu <b id="sCpu">—</b></span>
  <span>space <b id="sSpace">—</b></span>
</footer>
<script src="link.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const MVL = window.KYK;

/* ── state ─────────────────────────────────────────────────────────── */
let link = null, info = null, desc = null, space = null;
/* The panel, as the module describes it.
 *
 * The descriptor has carried the jacks since M2 and nothing about the knobs,
 * not because the page ignored it but because the firmware never called
 * Host::Pages — the names, idents and units were all declared and never
 * published. With that one line the pager component arrives as
 * { pages, pots, pageNames[], fields:[{id,name,page,pot,disp,...}] } and the
 * page can mirror the panel rather than describe it in the abstract. */
let panel = null;
function parsePanel(d) {
  if (!d) return null;
  const walk = (o) => {
    if (!o || typeof o !== 'object') return null;
    if (Array.isArray(o)) { for (const v of o) { const r = walk(v); if (r) return r; } return null; }
    if (Array.isArray(o.fields) && o.pots > 0 && o.pages > 0) return o;
    for (const k of Object.keys(o)) { const r = walk(o[k]); if (r) return r; }
    return null;
  };
  const pg = walk(d);
  if (!pg) return null;
  const pots = pg.pots | 0, pages = pg.pages | 0;
  const grid = Array.from({ length: pages }, () => new Array(pots).fill(null));
  for (const f of pg.fields) {
    if (f == null || f.page >= pages || f.pot >= pots) continue;
    grid[f.page][f.pot] = { name: f.name || f.id || '', id: f.id || '', disp: f.disp || null };
  }
  return { pages, pots, names: pg.pageNames || [], colors: pg.pageColors || [], grid };
}   /* space: parsed 0x61, null when analytic */
let tel = null;                 /* latest telemetry */
let stats = null;               /* latest 0x63 */
let axes = [0, 1];              /* projection */
let worlds = null;              /* { current, list } from 0x65 */
let switching = -1;             /* world index mid-switch, or -1 */
/* An analytic world is a formula small enough to hold here, so the page can
 * evaluate the whole space itself and shade it rather than drawing dots at
 * the few points the module happens to sample. */
let basis = null, basisWorld = -1;
/* The first two labels used to name the wrong quantities: index 0 computes
   what the firmware calls `centroid`, and index 2 computes what it calls
   `bright`. */
const SHADE = [
  { id: 'centroid', label: 'centroid' },
  { id: 'flat', label: 'flatness' },
  { id: 'high', label: 'high end' },
];
let shadeIdx = 0;

/* Terrain palettes.
 *
 * Four palettes and an off switch, because "which colours" is a taste question
 * and measurement cannot answer it — only rule out the answers that are
 * unreadable. All four are monotone in L*, which is what keeps a map legible
 * rather than decorative, and all four are weighted dark: between 48% and 57%
 * of each ramp sits below L*20, so the field reads as black with structure
 * emerging from it.
 *
 * That weighting is a reversal and worth recording. An earlier pass re-spaced
 * the stops for uniform perceptual steps, which is the right objective if you
 * want to read fine structure everywhere — and it lifted the mid-tone from
 * L*25 to L*41, so the page stopped looking black. Even lightness steps and a
 * dark field are not the same goal, and the second one is the one that was
 * actually wanted here.
 */
const PAL_STOPS = [0, 0.44, 0.70, 0.88, 1];
const PALETTE = [
  { id: 'ember',     lut: [[6,7,10],[38,18,20],[110,45,28],[196,116,44],[255,214,150]] },
  { id: 'ink',       lut: [[6,7,12],[22,24,58],[64,52,140],[118,110,214],[196,214,255]] },
  { id: 'verdigris', lut: [[5,9,10],[16,38,38],[30,88,80],[92,164,132],[214,238,206]] },
  { id: 'ash',       lut: [[8,8,9],[40,40,42],[92,92,96],[160,160,166],[240,240,244]] },
  { id: 'off',       lut: null },
];
let palIdx = 0;
try { const v = localStorage.getItem('kyk.pal'); if (v !== null) palIdx = Math.max(0, Math.min(PALETTE.length - 1, +v)); } catch {}
const RAMPS = PALETTE.map(p => {
  if (!p.lut) return null;
  const lut = new Uint8Array(256 * 3);
  for (let i = 0; i < 256; i++) {
    const t = i / 255; let a = 0;
    for (let q = 0; q < 4; q++) if (t >= PAL_STOPS[q] && t <= PAL_STOPS[q + 1]) { a = q; break; }
    const lo = PAL_STOPS[a], hi = PAL_STOPS[a + 1];
    const u = hi > lo ? (t - lo) / (hi - lo) : 0;
    for (let c = 0; c < 3; c++) lut[i * 3 + c] = Math.round(p.lut[a][c] + (p.lut[a + 1][c] - p.lut[a][c]) * u);
  }
  return lut;
});

const terrain = { key: '', canvas: null, res: 72, at: 0, flat: false };
/* Buffers are allocated once at the longest tail; `cap` is how much of them is
   live, so changing the length costs no allocation. C holds the timbre each
   sample was taken at, so an old stretch of path keeps the colour it had
   rather than being repainted with the present. */
const TRAIL_MAX = 1800;
const TAILS = [{ label: 'short', n: 150 }, { label: 'med', n: 400 },
               { label: 'long', n: 900 }, { label: 'max', n: TRAIL_MAX }];
/* Density trades span for detail at a fixed sample count: the interval is a
   multiple of whatever the motion pacing asked for, so `sparse` covers three
   times as long a window with the same number of dots. */
const DENSITIES = [{ label: 'dense', mul: 1 / 3 }, { label: 'normal', mul: 1 },
                   { label: 'sparse', mul: 3 }, { label: 'wide', mul: 10 }];
let tailIdx = 1, densIdx = 1;
try {
  const t = localStorage.getItem('kyk.tail'), d = localStorage.getItem('kyk.dens');
  if (t !== null) tailIdx = Math.max(0, Math.min(TAILS.length - 1, +t));
  if (d !== null) densIdx = Math.max(0, Math.min(DENSITIES.length - 1, +d));
} catch {}
const trail = { L: new Float32Array(TRAIL_MAX * 2), R: new Float32Array(TRAIL_MAX * 2),
                C: new Float32Array(TRAIL_MAX), n: 0, head: 0, at: -1, step: 1, gap: 1, fast: 0,
                cap: TAILS[tailIdx].n };
/* Plane rates, in turns per second, measured off the angles rather than
   assumed: the page is never told what rate was asked for, only where the
   rotation has got to. */
const spin = { ang: null, block: -1, rate: null };
const view = { S: 300 };
/* The falling body, kept separately from the position trail: it lives in the
 * control frame, before rotation, and is stored relative to its attractor. So
 * it stays a clean conic even while the rotation is dragging the position
 * trail somewhere else entirely. */
/* Which axes clamp and which wrap.
 *
 * A lattice world says so in its descriptor and that is used when it is there.
 * A formula world ships no topology, so it is worked out by watching: when the
 * unfolded centre leaves [0,1] the module has already folded it, and comparing
 * the folded position against both candidate folds says which one happened.
 * Evidence only arrives while an axis is actually outside, so the votes are
 * kept rather than recomputed, and only decisive frames vote — under a stereo
 * spread posL carries an extra rotation and neither candidate matches, which
 * shows up as both errors being large and is skipped rather than guessed at. */
const foldVote = new Float32Array(6);
const KEP_N = 900;
const kepTrail = { xy: new Float32Array(KEP_N * 2), r: new Float32Array(KEP_N), n: 0, head: 0, plane: -1 };
/* The observed range of `rush`. It is a rate, not a normalised quantity, and
   how big it gets depends on the mass and the radius, so a fixed mapping is
   either flat on a gentle orbit or saturated on a violent one. */
const rushEnv = { lo: 0, hi: 0.2 };
/* Recent history of the lock figure. One number in a bar says how locked the
   rotation is now; it cannot say whether it is settling into a ratio, sliding
   out of one, or hunting — and which of those is happening is the interesting
   part of watching Arnold tongues at all. */
const LOCK_N = 120;
const lockHist = { v: new Float32Array(LOCK_N), n: 0, head: 0 };
let lastBlock = -1, framesSeen = 0, fpsWin = { t0: performance.now(), n: 0, fps: 0 };
/* The module's block clock, measured rather than assumed. It is nominally
   48000/24 = 2000 Hz, but nothing on the wire says so, and the trail's pacing
   is expressed in blocks because that is the only clock both ends share. */
let blockHz = 2000, blockWin = { t0: performance.now(), b0: -1 };
let polling = false;

const say = (s, bad) => { $('msg').textContent = s || ''; $('msg').style.color = bad ? 'var(--bad)' : 'var(--dim)'; };

/* ── connection ─────────────────────────────────────────────────────── */
async function connect(transport) {
  if (link) await disconnect();
  link = new MVL.Link(transport);
  link.onClose = () => { say('link closed'); disconnect(); };
  link.onError = e => say('link error: ' + (e && e.message || e), true);
  try {
    await link.start();
    info = await MVL.hello(link);
    desc = await MVL.getDescriptor(link, info).catch(() => null);
    panel = parsePanel(desc);
    /* An analytic world has no lattice, so 0x61 refuses — that is not a
     * failure to connect. */
    space = await refreshSpace();
  } catch (e) { say('connect failed: ' + e.message, true); await disconnect(); return; }
  $('modinfo').textContent = `${info.name} · fw ${info.fw} (${info.git}) · ${transport.kind}`;
  $('sMod').textContent = info.id + ' ' + info.fw;
  await refreshWorlds();
  renderMorphSel();
  await refreshCard();
  $('btnClose').hidden = false; $('btnSerial').hidden = true; $('btnBridge').hidden = true;
  const dev = transport.kind === 'bridge';
  $('btnDrawer').hidden = !dev;
  if (dev) buildDrawer(); else $('drawer').classList.remove('show');
  buildAxisButtons();
  trail.n = 0; trail.head = 0; trail.at = -1; lastBlock = -1;
  say('');
  polling = true; pollTelemetry(); pollStats();
}
async function disconnect() {
  polling = false;
  const l = link; link = null; tel = null; stats = null; info = null; panel = null;
  worlds = null; basis = null; basisWorld = -1; switching = -1; terrain.key = '';
  renderWorldBar();
  if (l) { try { await l.close(); } catch {} }
  $('modinfo').textContent = 'not connected';
  $('btnClose').hidden = true; $('btnSerial').hidden = false; $('btnBridge').hidden = false; $('btnDrawer').hidden = true;
  $('drawer').classList.remove('show');
}
$('btnClose').onclick = () => disconnect();
$('btnSerial').onclick = async () => {
  if (!navigator.serial) { say('Web Serial needs Chrome/Edge on desktop', true); return; }
  try {
    const port = await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x0483, usbProductId: 0x5740 }] });
    await port.open({ baudRate: 115200 });
    await connect(new MVL.SerialTransport(port));
  } catch (e) { say('serial: ' + e.message, true); }
};
function bridgeUrl() { return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/link'; }
$('btnBridge').onclick = () => connectBridge(true);
function connectBridge(loud) {
  say('bridge…');
  const ws = new WebSocket(bridgeUrl());
  ws.onopen = () => connect(new MVL.WsTransport(ws));
  ws.onerror = () => { if (loud) say('no bridge at ' + bridgeUrl() + ' — run node tools/bridge/bridge.mjs', true); else say(''); };
}
$('btnDrawer').onclick = () => { $('drawer').classList.toggle('show'); resize(); };

/* ── worlds ─────────────────────────────────────────────────────────────
 * A world is a corpus, a representation and an extrapolation method
 * (docs/worlds.md). Analytic ones are a formula the page can evaluate;
 * tabulated ones are a lattice the module has to expand, which takes a
 * moment and is why the chip goes quiet while it happens. */
async function refreshSpace() {
  if (!link) return null;
  try { return MVL.parseSpaceInfo(await link.request(MVL.CMD.spaceInfo, new Uint8Array(0), { urgent: true })); }
  catch { return null; }          /* analytic: no lattice to describe */
}
function describeSpace() {
  const w = worlds && worlds.list[worlds.current];
  const wn = w ? w.name : '—';
  $('sSpace').textContent = space
    ? `${wn} · ${space.side}^${space.n} K=${space.k} P=${space.p} ${space.topo.join('/')}`
    : (tel ? `${wn} · analytic N=${tel.n} K=${tel.k} P=${tel.p}` : wn);
}
async function refreshWorlds() {
  if (!link) return;
  try {
    worlds = await MVL.fetchWorlds(link);
  } catch { worlds = null; }
  renderWorldBar();
  describeSpace();
  await ensureBasis();
}
/* Fetch the current world's formula once, and keep it until the world
 * changes. About 1.3 KB, so this is a one-off cost, not a per-frame one. */
async function ensureBasis() {
  if (!link || !worlds) { basis = null; basisWorld = -1; return; }
  const w = worlds.list[worlds.current];
  if (!w) { basis = null; basisWorld = -1; return; }
  if (basisWorld === w.index && basis) return;
  basis = null; basisWorld = -1; terrain.key = '';
  if (w.analytic) {
    try {
      const b = await MVL.fetchBasis(link, w.index, info ? info.maxBody : 512);
      if (b) { basis = b; basisWorld = w.index; terrain.key = ''; }
    } catch { /* leave it null; the view falls back to lattice dots */ }
  }
  renderShadeChips();             /* the chips were drawn before this resolved */
}
async function selectWorld(i) {
  if (!link || !worlds || switching >= 0 || i === worlds.current) return;
  switching = i;
  renderWorldBar();
  try {
    /* A tabulated world has to be expanded before it can play; the module
     * answers BUSY until it is done, so give it a few tries. */
    for (let attempt = 0; ; attempt++) {
      try { await link.request(MVL.CMD.action, MVL.actionReq(MVL.ACT.selectWorld, [i]), { urgent: true, timeoutMs: 4000 }); break; }
      catch (e) { if (!/BUSY/.test(e.message) || attempt > 20) throw e; await new Promise(r => setTimeout(r, 120)); }
    }
    /* The action only queues the switch: the module performs it on its
     * control loop, and a tabulated world has to be expanded first. So the
     * request returning does not mean the world has changed yet. Reading the
     * list straight back gave the old value, which is why this used to take
     * two clicks. Poll until the module agrees, or give up. */
    const deadline = Date.now() + 8000;
    for (;;) {
      await new Promise(r => setTimeout(r, 60));
      let w = null;
      try { w = await MVL.fetchWorlds(link); } catch { /* keep waiting */ }
      if (w) worlds = w;
      if (w && w.current === i) break;
      if (Date.now() > deadline) { say('world: the module did not switch', true); break; }
    }
    space = await refreshSpace();
    trail.n = 0; trail.head = 0; trail.at = -1;
    renderWorldBar();
    describeSpace();
    await ensureBasis();
  } catch (e) { say('world: ' + e.message, true); }
  switching = -1;
  renderWorldBar();
}
function worldNoteFor(w) {
  if (!w) return '';
  return w.name + ' — ' + w.note + (w.analytic ? ' (a formula, drawn here)' : ' (a lattice, expanded on the module)');
}
function renderWorldBar() {
  const box = $('worldChips'); box.innerHTML = '';
  const note = $('worldNote');
  if (!worlds) {
    $('worldCap').textContent = 'WORLD';
    note.textContent = link ? '—' : ''; note.classList.remove('peek');
    renderShadeChips(); return;
  }
  /* the count is here because with this many worlds you cannot tell at a
     glance whether they all arrived — and for a while they did not, because
     the list outgrew one frame and the tail was silently dropped */
  const formulae = worlds.list.filter(w => w.analytic).length;
  $('worldCap').textContent = 'WORLD ' + worlds.list.length + '/' + worlds.count
                            + ' · ' + formulae + 'ƒ';
  const showCurrent = () => {
    note.classList.remove('peek');
    note.textContent = worldNoteFor(worlds.list.find(w => w.index === worlds.current));
  };
  for (const w of worlds.list) {
    const b = document.createElement('button');
    b.className = 'chip' + (w.index === worlds.current ? ' on' : '') + (w.analytic ? ' analytic' : '');
    b.textContent = switching === w.index ? 'expanding…' : w.name;
    b.title = worldNoteFor(w);
    b.disabled = switching >= 0;
    b.onclick = () => selectWorld(w.index);
    /* hovering reads out that world without selecting it, which is the only
       way to find your way around eighteen of them */
    b.onmouseenter = () => { note.classList.add('peek'); note.textContent = worldNoteFor(w); };
    b.onmouseleave = showCurrent;

/* ── importing waveforms and placing them ────────────────────────────────
 *
 * WaveEdit and the AKWF corpus already make and shape single cycles better
 * than anything worth writing here, so this only imports and places: the part
 * that is specific to an N-dimensional instrument and that no existing tool
 * does.
 *
 * Placement defaults to the 24-cell's own vertices — the same arrangement the
 * built-in Lock world uses, which puts one family of waveforms on each Givens
 * rotation plane, so aligning with a plane finds a related set rather than
 * twenty-four unrelated things. It is a starting point, not a cage.
 */
const imported = [];           /* { name, mags, fit } */
let importMode = 'shape';

/* The 24-cell: every permutation of (+-1, +-1, 0, 0), walked plane by plane so
   vertex group g lands in Givens plane g (core/kyk_lock.h). */
function cellPositions(count) {
  const out = [], r = 0.42;
  for (let i = 0; i < 4 && out.length < count; i++)
    for (let j = i + 1; j < 4 && out.length < count; j++)
      for (let si = -1; si <= 1 && out.length < count; si += 2)
        for (let sj = -1; sj <= 1 && out.length < count; sj += 2) {
          const p = [0.5, 0.5, 0.5, 0.5];
          p[i] = 0.5 + si * r * 0.7071;
          p[j] = 0.5 + sj * r * 0.7071;
          out.push(p);
        }
  return out;
}

function renderImport() {
  const n = imported.length;
  $('wavMode').textContent = importMode;
  $('wavSend').disabled = !link || !n;
  $('wavClear').disabled = !n;
  if (!n) { $('wavState').textContent = link ? '' : 'connect to send'; return; }
  /* The fit is the fraction of each wave that survives projection onto the
     sine basis. Showing the worst is the useful summary: it is the one the
     person choosing waveforms would want to reconsider. */
  let worst = 1, worstName = '';
  for (const w of imported) if (w.fit < worst) { worst = w.fit; worstName = w.name; }
  $('wavState').textContent = importMode === 'spectrum'
    ? `${n} wave${n > 1 ? 's' : ''} · spectrum kept exactly, waveform redrawn`
    : `${n} wave${n > 1 ? 's' : ''} · worst fit ${(100 * worst).toFixed(0)}% (${worstName})`;
}

async function addWavs(files) {
  for (const f of files) {
    if (imported.length >= 24) { say('24 nodes is the limit', true); break; }
    try {
      const cyc = MVL.wavToCycle(new Uint8Array(await f.arrayBuffer()));
      const nd = MVL.cycleToNode(cyc, 64, importMode);
      imported.push({ name: f.name.replace(/\.wav$/i, ''), mags: nd.mags, fit: nd.fit });
    } catch (e) { say(f.name + ': ' + e.message, true); }
  }

async function sendImported() {
  if (!link || !imported.length) return;
  const pos = cellPositions(imported.length);
  const blob = MVL.buildUserWorld(imported.map((w, i) => ({ pos: pos[i], mags: w.mags })),
                                  { n: 4, k: 64, sigma: 0.26, name: 'import' });
  try {
    await MVL.putWorld(link, blob, (done, all) =>
      say(`sending ${(100 * done / all).toFixed(0)}%`));
    say(`${imported.length} waveforms placed on the 24-cell (${blob.length} bytes)`);
    setTimeout(() => refreshWorlds(), 250);

/* ── polling ────────────────────────────────────────────────────────── */
async function pollTelemetry() {
  while (polling && link) {
    const t0 = performance.now();
    try {
      const b = await link.request(MVL.CMD.telemetry, MVL.telemetryReq(7), { key: 'tel', timeoutMs: 800 });
      const t = MVL.parseTelemetry(b);
      if (t) { tel = t; onTelemetry(t); }
    } catch (e) { if (!link) break; if (!/timeout/.test(e.message)) say('telemetry: ' + e.message, true); }
    const wait = 1000 / 60 - (performance.now() - t0);
    if (wait > 0) await new Promise(r => setTimeout(r, wait));
  }
}
async function pollStats() {
  while (polling && link) {
    try { stats = MVL.parseStats(await link.request(MVL.CMD.stats, new Uint8Array(0), { key: 'stats' })); } catch {}
    await new Promise(r => setTimeout(r, 1000));
  }
}
function onTelemetry(t) {
  if (lastBlock < 0) describeSpace();   /* an analytic world gets its dims from here */
  if (t.block !== lastBlock) {
    lastBlock = t.block; framesSeen++;
    /* The smoothing runs on every block the page sees, not on the trail's own
       paced clock, so its time constant stays 0.12 s however the trail is
       spaced. */
    timbreAt(t.posL);
    const paced = trailStep(t, t.n);
    trail.step = paced.step; trail.fast = paced.fast;
    const due = t.block - trail.at;
    if (trail.at < 0 || due < 0 || due >= trail.step) {
      /* The spacing actually achieved, which is not the spacing asked for. The
         page sees telemetry at its poll rate, roughly sixty times a second, so
         thirty-odd blocks pass between anything it can sample; a step under
         that is a request the poll loop cannot honour. Measuring the gap
         rather than assuming it keeps the window label and the undersampling
         warning honest about what is really on screen. */
      if (trail.at >= 0 && due > 0) trail.gap += (due - trail.gap) * 0.2;
      trail.at = t.block;
      const i = trail.head;
      trail.L[2 * i] = t.posL[axes[0]]; trail.L[2 * i + 1] = t.posL[axes[1]];
      trail.R[2 * i] = t.posR[axes[0]]; trail.R[2 * i + 1] = t.posR[axes[1]];
      trail.C[i] = timbre.v;
      trail.head = (i + 1) % trail.cap; if (trail.n < trail.cap) trail.n++;
    }
    if (typeof t.lock === 'number') {
      lockHist.v[lockHist.head] = t.lock;
      lockHist.head = (lockHist.head + 1) % LOCK_N;
      if (lockHist.n < LOCK_N) lockHist.n++;
    }
    const kp = t.kepler;
    if (kp && kp.running) {
      if (kp.plane !== kepTrail.plane) { kepTrail.plane = kp.plane; kepTrail.n = 0; kepTrail.head = 0; }
      const j = kepTrail.head;
      kepTrail.xy[2 * j] = kp.x; kepTrail.xy[2 * j + 1] = kp.y; kepTrail.r[j] = kp.rush;
      rushEnv.lo += (kp.rush < rushEnv.lo ? 0.2 : 0.002) * (kp.rush - rushEnv.lo);
      rushEnv.hi += (kp.rush > rushEnv.hi ? 0.2 : 0.002) * (kp.rush - rushEnv.hi);
      kepTrail.head = (j + 1) % KEP_N; if (kepTrail.n < KEP_N) kepTrail.n++;
    } else if (kepTrail.n) { kepTrail.n = 0; kepTrail.head = 0; kepTrail.plane = -1; rushEnv.lo = 0; rushEnv.hi = 0.2; }
  }
  fpsWin.n++; const now = performance.now();
  if (now - fpsWin.t0 > 1000) { fpsWin.fps = fpsWin.n * 1000 / (now - fpsWin.t0); fpsWin.t0 = now; fpsWin.n = 0; }
  if (blockWin.b0 < 0) { blockWin.b0 = t.block; blockWin.t0 = now; }
  else if (now - blockWin.t0 > 2000) {
    const hz = (t.block - blockWin.b0) * 1000 / (now - blockWin.t0);
    if (hz > 1) blockHz = hz;
    blockWin.b0 = t.block; blockWin.t0 = now;
  }
}

/* How many blocks to leave between trail samples.
 *
 * Six hundred samples taken one per poll cover about ten seconds, which is the
 * wrong window for almost every rotation anyone actually dials in: a plane
 * turning once a minute drew a sixth of its circle and looked like a drifting
 * line, and the closed loop — the thing the trail exists to show — was never
 * on screen at all. So the trail is paced instead by the slowest rotation that
 * is actually moving the picture, and holds one full turn of it.
 *
 * Only planes touching a drawn axis are considered, because a rotation in a
 * plane that is entirely off-screen changes nothing here, and only those whose
 * excursion clears a couple of pixels — a plane whose radius has collapsed to
 * the pivot is turning but not going anywhere, and letting it in would stretch
 * the window towards infinity for no visible gain. The admit and drop
 * thresholds differ so a plane hovering at the boundary does not chatter.  */
function trailStep(t, n) {
  const planes = MVL.planeCount(n);
  if (!t.angle || !spin.ang || spin.ang.length !== planes) {
    spin.ang = t.angle ? Float32Array.from(t.angle) : null;
    spin.rate = new Float32Array(planes); spin.block = t.block;
    return { step: 1, fast: 0 };
  }
  const db = t.block - spin.block;
  if (db > 0) {
    const dt = db / blockHz;
    for (let q = 0; q < planes; q++) {
      /* angles are in turns and wrap, so take the short way round */
      let d = t.angle[q] - spin.ang[q];
      d -= Math.round(d);
      const r = Math.abs(d) / dt;
      spin.rate[q] += (r - spin.rate[q]) * 0.2;
      spin.ang[q] = t.angle[q];
    }
    spin.block = t.block;
  }
  const [ax, ay] = axes;
  let slow = 0, fast = 0;
  for (let q = 0; q < planes; q++) {
    const [i, j] = MVL.planeAxes(n, q);
    if (i !== ax && j !== ax && i !== ay && j !== ay) continue;
    const c = t.centre || t.posL;
    const rad = Math.hypot(c[i] - 0.5, c[j] - 0.5);
    const px2 = 2 * rad * view.S;
    if (px2 < (spin.rate[q] > 0 && trail.step > 1 ? 1 : 2)) continue;   /* hysteresis */
    const w = spin.rate[q];
    if (w < 1e-4) continue;
    if (!slow || w < slow) slow = w;
    if (w > fast) fast = w;
  }
  if (!slow) return { step: 1, fast };
  const want = blockHz * DENSITIES[densIdx].mul / (slow * trail.cap);
  return { step: Math.max(1, Math.round(want)), fast };
}

/* ── one spectral measure, on an absolute domain ────────────────────────
 * The terrain and the dot both read this, so the same colour means the same
 * thing in both — and, because nothing here is scaled to the slice it came

 *
 * Each measure is logged onto [0,1] against its own bound, so there is no

 * the ramp. Logged, those same two slices span 0.16 to 0.36 and 0.08 to 0.47:
 * four to five times as much ramp, from a transform that is the same for
 * every world and so leaves them comparable. Across all 21 worlds the logged
 * spans run from 0.065 (Edge, centroid) to 0.954 (Braids, high end).
 *
 * The high-end fraction is the one that needs a chosen constant, and it is
 * chosen here rather than hidden: it has no positive lower bound, because it
 * is exactly zero over the whole of Plate and the whole of Drum — no energy

  if (stats) {
    const pct = v => stats.cyclesBudget ? (100 * v / stats.cyclesBudget).toFixed(0) + '%' : v;
    setText('sCpu', `${pct(stats.cyclesLast)} last · ${pct(stats.cyclesAvg)} avg · ${pct(stats.cyclesMax)} max · div ${stats.renderDiv}${stats.overruns ? ' · ' + stats.overruns + ' overruns' : ''}${stats.dropped ? ' · ' + stats.dropped + ' dropped' : ''}`);
    $('sCpuWrap').classList.toggle('warn', stats.overruns > 0 || (stats.cyclesBudget && stats.cyclesMax > 0.7 * stats.cyclesBudget));
  }
}
/* The draw loop reschedules itself whatever happens.
 *
 * It used to call requestAnimationFrame *after* the three draws, so a single
 * throw in any of them stopped the loop for good: the last good frame stayed
 * painted, nothing ever updated again, and because click handlers run on their
 * own stack the page went on sending commands to the module quite happily. It
 * looked like a hung link rather than a dead renderer, which is the worst way
 * for it to fail. A drawing bug should cost one frame, not the session.
 *
 * The message is reported once per distinct error so a fault that repeats
 * sixty times a second does not bury everything else in the status line. */
let lastDrawError = '';
function frame() {
  try { drawSpace(); drawSound(); drawStatus(); }
  catch (e) {
    const m = (e && e.message) || String(e);
    if (m !== lastDrawError) { lastDrawError = m; say('draw: ' + m, true); console.error(e); }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ── dev drawer (bridge only): 0x6E SET_CONTROL at ≤ 30 Hz ─────────── */
const ctl = { f0: 110, c: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5], ang: new Array(15).fill(0), spread: 0 };
let sendPending = false, lastSend = 0;
function sendControl() {
  if (!link || link.kind !== 'bridge') return;
  const now = performance.now();
  if (now - lastSend < 33) { if (!sendPending) { sendPending = true; setTimeout(() => { sendPending = false; sendControl(); }, 33 - (now - lastSend)); } return; }
  lastSend = now;
  const n = tel ? tel.n : 4, planes = MVL.planeCount(n);
  link.request(MVL.CMD.setControl, MVL.setControlReq(ctl.f0, ctl.c.slice(0, n), ctl.ang.slice(0, planes), ctl.spread), { urgent: true, key: 'ctl' }).catch(e => say('control: ' + e.message, true));
}
function buildDrawer() {
  const d = $('drawer'); d.innerHTML = '';
  const n = tel ? tel.n : (space ? space.n : 4), planes = MVL.planeCount(n);
  if (tel) { ctl.f0 = tel.f0; for (let a = 0; a < n; a++) ctl.c[a] = tel.ctl[a]; for (let p = 0; p < planes; p++) ctl.ang[p] = tel.angle[p]; ctl.spread = tel.spread; }
  const row = (name, min, max, step, get, set, fmt) => {
    const l = document.createElement('label'); const s = document.createElement('span'); s.textContent = name;
    const i = document.createElement('input'); i.type = 'range'; i.min = min; i.max = max; i.step = step; i.value = get();
    const o = document.createElement('output'); o.textContent = fmt(get());
    i.oninput = () => { set(parseFloat(i.value)); o.textContent = fmt(get()); sendControl(); };
    l.append(s, i, o); d.appendChild(l);
  };
  const h = t => { const e = document.createElement('h4'); e.textContent = t; d.appendChild(e); };
  h('PITCH · POSITION');
  row('f0', Math.log2(20), Math.log2(2000), 0.001, () => Math.log2(ctl.f0), v => ctl.f0 = Math.pow(2, v), () => ctl.f0.toFixed(1) + ' Hz');
  for (let a = 0; a < n; a++) row('axis ' + a, -0.2, 1.2, 0.001, () => ctl.c[a], v => ctl.c[a] = v, v => v.toFixed(3));
  h('ROTATION (turns)');
  for (let p = 0; p < planes; p++) { const [x, y] = MVL.planeAxes(n, p); row('plane ' + x + y, 0, 1, 0.001, () => ctl.ang[p], v => ctl.ang[p] = v, v => v.toFixed(3)); }
  h('STEREO');
  row('spread', 0, 0.12, 0.0005, () => ctl.spread, v => ctl.spread = v, v => v.toFixed(4));
  d.classList.add('show'); resize();
}

/* auto-connect to the bridge when served from it */
/* Auto-connect to the bridge when the page came from it — unless ?serial is
 * in the URL, which keeps the link free for the module (the Serial button is
 * hidden while any transport is connected). */
if (!/[?&]serial\b/.test(location.search)
    && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)
    && location.protocol.startsWith('http')) connectBridge(false);
if (!navigator.serial) $('btnSerial').title = 'Web Serial: Chrome/Edge desktop only';
})();
</script>
