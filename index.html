<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyklophoria</title>
<style>
  :root { --bg: #07090c; --ink: #cfd6dd; --dim: #5d6873; --line: #1a2028; --hot: #ffcc55; --l: #62d5ff; --r: #ff7a9e; --ok: #6ee7a0; --bad: #ff5c5c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.35 ui-monospace, "SF Mono", Menlo, Consolas, monospace; height: 100%; overflow: hidden; }
  body { display: grid; grid-template-rows: auto auto 1fr auto auto; height: 100vh; }
  header { display: flex; align-items: center; gap: 12px; padding: 6px 12px; border-bottom: 1px solid var(--line); }
  header .name { font-weight: 600; letter-spacing: .08em; color: var(--hot); }
  header .sp { flex: 1; }
  button { background: #0f141a; color: var(--ink); border: 1px solid #263039; border-radius: 3px; padding: 3px 9px; font: inherit; cursor: pointer; }
  button:hover { border-color: #3a4855; } button.on { border-color: var(--hot); color: var(--hot); }
  button:disabled { opacity: .4; cursor: default; }
  /* world strip: which space the module is indexing, and how the terrain is shaded */
  /* Two rows, not one wrapping row. With nine worlds the chips fitted beside
     the description and it read fine; at eighteen they wrap, and a single flex
     row wraps the description in among them — names and notes jumbled
     together. The list only grows, so the chips get a line of their own. */
  #worldbar { display: flex; flex-direction: column; gap: 3px; padding: 4px 12px;
              border-bottom: 1px solid var(--line); font-size: 11px; color: var(--dim); }
  #worldbar .wrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 20px; }
  #worldbar .cap { letter-spacing: .1em; flex: none; }
  #worldbar .sp { flex: 1; }
  #worldChips, #shadeChips { display: flex; gap: 6px; flex-wrap: wrap; }
  /* one line, clipped rather than pushing the row taller */
  #worldNote { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
               white-space: nowrap; font-style: italic; }
  #worldNote.peek { color: var(--ink); font-style: normal; }
  .chip { background: #0f141a; color: var(--dim); border: 1px solid #263039; border-radius: 3px;
          padding: 1px 8px; font: inherit; cursor: pointer; white-space: nowrap; }
  .chip:hover { border-color: #3a4855; color: var(--ink); }
  .chip.on { border-color: var(--hot); color: var(--hot); }
  .chip.analytic::after { content: " ƒ"; opacity: .75; }   /* has a formula */
  .chip:disabled { opacity: .45; cursor: default; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 34%); gap: 0; min-height: 0; }
  .pane { position: relative; min-width: 0; min-height: 0; border-right: 1px solid var(--line); }
  .pane:last-child { border-right: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  .overlay { position: absolute; left: 10px; top: 8px; display: flex; gap: 4px; flex-wrap: wrap; }
  .overlay button { padding: 1px 6px; font-size: 11px; color: var(--dim); }
  .overlay button.on { color: var(--hot); }
  .label { position: absolute; right: 10px; top: 8px; color: var(--dim); font-size: 11px; letter-spacing: .1em; }
  footer { display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 5px 12px; border-top: 1px solid var(--line); color: var(--dim); font-size: 12px; }
  footer b { color: var(--ink); font-weight: 500; }
  footer .warn b { color: var(--bad); }
  #drawer { border-top: 1px solid var(--line); padding: 6px 12px; display: none; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 4px 18px; font-size: 11px; color: var(--dim); max-height: 34vh; overflow: auto; }
  #drawer.show { display: grid; }
  #drawer label { display: flex; align-items: center; gap: 8px; min-width: 0; }
  #drawer label span { flex: 0 0 72px; white-space: nowrap; overflow: hidden; }
  #drawer label output { flex: 0 0 68px; text-align: right; color: var(--ink); white-space: nowrap; }
  #drawer input[type=range] { flex: 1 1 60px; min-width: 60px; accent-color: var(--hot); height: 14px; margin: 0; }
  #drawer h4 { grid-column: 1 / -1; margin: 4px 0 0; font-weight: 500; color: var(--dim); font-size: 11px; letter-spacing: .1em; }
  #msg { color: var(--dim); }
</style>
</head>
<body>
<header>
  <span class="name">Kyklophoria</span>
  <span id="modinfo" style="color:var(--dim)">not connected</span>
  <span class="sp"></span>
  <span id="msg"></span>
  <button id="btnSerial">Serial</button>
  <button id="btnBridge">Bridge</button>
  <button id="btnDrawer" hidden>Controls</button>
  <button id="btnClose" hidden>Disconnect</button>
</header>
<nav id="worldbar">
  <div class="wrow">
    <span class="cap" id="worldCap">WORLD</span>
    <span id="worldChips"></span>
  </div>
  <div class="wrow">
    <span id="worldNote"></span>
    <span class="sp"></span>
    <span class="cap">SHADE</span>
    <span id="shadeChips"></span>
  </div>
</nav>
<main>
  <div class="pane">
    <canvas id="space"></canvas>
    <div class="overlay" id="axes"></div>
    <div class="label">SPACE</div>
  </div>
  <div class="pane">
    <canvas id="sound"></canvas>
    <div class="label">SOUND</div>
  </div>
</main>
<div id="drawer"></div>
<footer>
  <span>module <b id="sMod">—</b></span>
  <span>block <b id="sBlock">—</b></span>
  <span>f0 <b id="sF0">—</b></span>
  <span>kcut <b id="sKcut">—</b></span>
  <span>spread <b id="sSpread">—</b></span>
  <span>link <b id="sLink">—</b></span>
  <span id="sCpuWrap">cpu <b id="sCpu">—</b></span>
  <span>space <b id="sSpace">—</b></span>
</footer>
<script src="link.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const MVL = window.KYK;

/* ── state ─────────────────────────────────────────────────────────── */
let link = null, info = null, desc = null, space = null;   /* space: parsed 0x61, null when analytic */
let tel = null;                 /* latest telemetry */
let stats = null;               /* latest 0x63 */
let axes = [0, 1];              /* projection */
let worlds = null;              /* { current, list } from 0x65 */
let switching = -1;             /* world index mid-switch, or -1 */
/* An analytic world is a formula small enough to hold here, so the page can
 * evaluate the whole space itself and shade it rather than drawing dots at
 * the few points the module happens to sample. */
let basis = null, basisWorld = -1;
const SHADE = [
  { id: 'bright', label: 'brightness' },
  { id: 'flat', label: 'flatness' },
  { id: 'high', label: 'high end' },
];
let shadeIdx = 0;
const terrain = { key: '', canvas: null, res: 72, lo: 0, hi: 1, at: 0 };
const TRAIL_N = 600;
const trail = { L: new Float32Array(TRAIL_N * 2), R: new Float32Array(TRAIL_N * 2), n: 0, head: 0 };
/* The falling body, kept separately from the position trail: it lives in the
 * control frame, before rotation, and is stored relative to its attractor. So
 * it stays a clean conic even while the rotation is dragging the position
 * trail somewhere else entirely. */
const KEP_N = 900;
const kepTrail = { xy: new Float32Array(KEP_N * 2), n: 0, head: 0, plane: -1 };
let lastBlock = -1, framesSeen = 0, fpsWin = { t0: performance.now(), n: 0, fps: 0 };
let polling = false;

const say = (s, bad) => { $('msg').textContent = s || ''; $('msg').style.color = bad ? 'var(--bad)' : 'var(--dim)'; };

/* ── connection ─────────────────────────────────────────────────────── */
async function connect(transport) {
  if (link) await disconnect();
  link = new MVL.Link(transport);
  link.onClose = () => { say('link closed'); disconnect(); };
  link.onError = e => say('link error: ' + (e && e.message || e), true);
  try {
    await link.start();
    info = await MVL.hello(link);
    desc = await MVL.getDescriptor(link, info).catch(() => null);
    /* An analytic world has no lattice, so 0x61 refuses — that is not a
     * failure to connect. */
    space = await refreshSpace();
  } catch (e) { say('connect failed: ' + e.message, true); await disconnect(); return; }
  $('modinfo').textContent = `${info.name} · fw ${info.fw} (${info.git}) · ${transport.kind}`;
  $('sMod').textContent = info.id + ' ' + info.fw;
  await refreshWorlds();
  $('btnClose').hidden = false; $('btnSerial').hidden = true; $('btnBridge').hidden = true;
  const dev = transport.kind === 'bridge';
  $('btnDrawer').hidden = !dev;
  if (dev) buildDrawer(); else $('drawer').classList.remove('show');
  buildAxisButtons();
  trail.n = 0; trail.head = 0; lastBlock = -1;
  say('');
  polling = true; pollTelemetry(); pollStats();
}
async function disconnect() {
  polling = false;
  const l = link; link = null; tel = null; stats = null; info = null;
  worlds = null; basis = null; basisWorld = -1; switching = -1; terrain.key = '';
  renderWorldBar();
  if (l) { try { await l.close(); } catch {} }
  $('modinfo').textContent = 'not connected';
  $('btnClose').hidden = true; $('btnSerial').hidden = false; $('btnBridge').hidden = false; $('btnDrawer').hidden = true;
  $('drawer').classList.remove('show');
}
$('btnClose').onclick = () => disconnect();
$('btnSerial').onclick = async () => {
  if (!navigator.serial) { say('Web Serial needs Chrome/Edge on desktop', true); return; }
  try {
    const port = await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x0483, usbProductId: 0x5740 }] });
    await port.open({ baudRate: 115200 });
    await connect(new MVL.SerialTransport(port));
  } catch (e) { say('serial: ' + e.message, true); }
};
function bridgeUrl() { return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/link'; }
$('btnBridge').onclick = () => connectBridge(true);
function connectBridge(loud) {
  say('bridge…');
  const ws = new WebSocket(bridgeUrl());
  ws.onopen = () => connect(new MVL.WsTransport(ws));
  ws.onerror = () => { if (loud) say('no bridge at ' + bridgeUrl() + ' — run node tools/bridge/bridge.mjs', true); else say(''); };
}
$('btnDrawer').onclick = () => { $('drawer').classList.toggle('show'); resize(); };

/* ── worlds ─────────────────────────────────────────────────────────────
 * A world is a corpus, a representation and an extrapolation method
 * (docs/worlds.md). Analytic ones are a formula the page can evaluate;
 * tabulated ones are a lattice the module has to expand, which takes a
 * moment and is why the chip goes quiet while it happens. */
async function refreshSpace() {
  if (!link) return null;
  try { return MVL.parseSpaceInfo(await link.request(MVL.CMD.spaceInfo, new Uint8Array(0), { urgent: true })); }
  catch { return null; }          /* analytic: no lattice to describe */
}
function describeSpace() {
  const w = worlds && worlds.list[worlds.current];
  const wn = w ? w.name : '—';
  $('sSpace').textContent = space
    ? `${wn} · ${space.side}^${space.n} K=${space.k} P=${space.p} ${space.topo.join('/')}`
    : (tel ? `${wn} · analytic N=${tel.n} K=${tel.k} P=${tel.p}` : wn);
}
async function refreshWorlds() {
  if (!link) return;
  try {
    worlds = await MVL.fetchWorlds(link);
  } catch { worlds = null; }
  renderWorldBar();
  describeSpace();
  await ensureBasis();
}
/* Fetch the current world's formula once, and keep it until the world
 * changes. About 1.3 KB, so this is a one-off cost, not a per-frame one. */
async function ensureBasis() {
  if (!link || !worlds) { basis = null; basisWorld = -1; return; }
  const w = worlds.list[worlds.current];
  if (!w) { basis = null; basisWorld = -1; return; }
  if (basisWorld === w.index && basis) return;
  basis = null; basisWorld = -1; terrain.key = '';
  if (w.analytic) {
    try {
      const b = await MVL.fetchBasis(link, w.index, info ? info.maxBody : 512);
      if (b) { basis = b; basisWorld = w.index; terrain.key = ''; }
    } catch { /* leave it null; the view falls back to lattice dots */ }
  }
  renderShadeChips();             /* the chips were drawn before this resolved */
}
async function selectWorld(i) {
  if (!link || !worlds || switching >= 0 || i === worlds.current) return;
  switching = i;
  renderWorldBar();
  try {
    /* A tabulated world has to be expanded before it can play; the module
     * answers BUSY until it is done, so give it a few tries. */
    for (let attempt = 0; ; attempt++) {
      try { await link.request(MVL.CMD.action, MVL.actionReq(MVL.ACT.selectWorld, [i]), { urgent: true, timeoutMs: 4000 }); break; }
      catch (e) { if (!/BUSY/.test(e.message) || attempt > 20) throw e; await new Promise(r => setTimeout(r, 120)); }
    }
    /* The action only queues the switch: the module performs it on its
     * control loop, and a tabulated world has to be expanded first. So the
     * request returning does not mean the world has changed yet. Reading the
     * list straight back gave the old value, which is why this used to take
     * two clicks. Poll until the module agrees, or give up. */
    const deadline = Date.now() + 8000;
    for (;;) {
      await new Promise(r => setTimeout(r, 60));
      let w = null;
      try { w = await MVL.fetchWorlds(link); } catch { /* keep waiting */ }
      if (w) worlds = w;
      if (w && w.current === i) break;
      if (Date.now() > deadline) { say('world: the module did not switch', true); break; }
    }
    space = await refreshSpace();
    trail.n = 0; trail.head = 0;
    renderWorldBar();
    describeSpace();
    await ensureBasis();
  } catch (e) { say('world: ' + e.message, true); }
  switching = -1;
  renderWorldBar();
}
function worldNoteFor(w) {
  if (!w) return '';
  return w.name + ' — ' + w.note + (w.analytic ? ' (a formula, drawn here)' : ' (a lattice, expanded on the module)');
}
function renderWorldBar() {
  const box = $('worldChips'); box.innerHTML = '';
  const note = $('worldNote');
  if (!worlds) {
    $('worldCap').textContent = 'WORLD';
    note.textContent = link ? '—' : ''; note.classList.remove('peek');
    renderShadeChips(); return;
  }
  /* the count is here because with this many worlds you cannot tell at a
     glance whether they all arrived — and for a while they did not, because
     the list outgrew one frame and the tail was silently dropped */
  const formulae = worlds.list.filter(w => w.analytic).length;
  $('worldCap').textContent = 'WORLD ' + worlds.list.length + '/' + worlds.count
                            + ' · ' + formulae + 'ƒ';
  const showCurrent = () => {
    note.classList.remove('peek');
    note.textContent = worldNoteFor(worlds.list.find(w => w.index === worlds.current));
  };
  for (const w of worlds.list) {
    const b = document.createElement('button');
    b.className = 'chip' + (w.index === worlds.current ? ' on' : '') + (w.analytic ? ' analytic' : '');
    b.textContent = switching === w.index ? 'expanding…' : w.name;
    b.title = worldNoteFor(w);
    b.disabled = switching >= 0;
    b.onclick = () => selectWorld(w.index);
    /* hovering reads out that world without selecting it, which is the only
       way to find your way around eighteen of them */
    b.onmouseenter = () => { note.classList.add('peek'); note.textContent = worldNoteFor(w); };
    b.onmouseleave = showCurrent;
    box.appendChild(b);
  }
  showCurrent();
  renderShadeChips();
}
function renderShadeChips() {
  const box = $('shadeChips'); box.innerHTML = '';
  const live = !!basis;
  for (let i = 0; i < SHADE.length; i++) {
    const b = document.createElement('button');
    b.className = 'chip' + (i === shadeIdx && live ? ' on' : '');
    b.textContent = SHADE[i].label; b.disabled = !live;
    b.onclick = () => { shadeIdx = i; terrain.key = ''; renderShadeChips(); };
    box.appendChild(b);
  }
  if (!live) {
    const s = document.createElement('span');
    s.textContent = worlds ? 'tabulated, no formula to draw' : '';
    s.style.color = 'var(--dim)';
    box.appendChild(s);
  }
}
renderWorldBar();

/* ── polling ────────────────────────────────────────────────────────── */
async function pollTelemetry() {
  while (polling && link) {
    const t0 = performance.now();
    try {
      const b = await link.request(MVL.CMD.telemetry, MVL.telemetryReq(7), { key: 'tel', timeoutMs: 800 });
      const t = MVL.parseTelemetry(b);
      if (t) { tel = t; onTelemetry(t); }
    } catch (e) { if (!link) break; if (!/timeout/.test(e.message)) say('telemetry: ' + e.message, true); }
    const wait = 1000 / 60 - (performance.now() - t0);
    if (wait > 0) await new Promise(r => setTimeout(r, wait));
  }
}
async function pollStats() {
  while (polling && link) {
    try { stats = MVL.parseStats(await link.request(MVL.CMD.stats, new Uint8Array(0), { key: 'stats' })); } catch {}
    await new Promise(r => setTimeout(r, 1000));
  }
}
function onTelemetry(t) {
  if (lastBlock < 0) describeSpace();   /* an analytic world gets its dims from here */
  if (t.block !== lastBlock) {
    lastBlock = t.block; framesSeen++;
    const i = trail.head;
    trail.L[2 * i] = t.posL[axes[0]]; trail.L[2 * i + 1] = t.posL[axes[1]];
    trail.R[2 * i] = t.posR[axes[0]]; trail.R[2 * i + 1] = t.posR[axes[1]];
    trail.head = (i + 1) % TRAIL_N; if (trail.n < TRAIL_N) trail.n++;
    const kp = t.kepler;
    if (kp && kp.running) {
      if (kp.plane !== kepTrail.plane) { kepTrail.plane = kp.plane; kepTrail.n = 0; kepTrail.head = 0; }
      const j = kepTrail.head;
      kepTrail.xy[2 * j] = kp.x; kepTrail.xy[2 * j + 1] = kp.y;
      kepTrail.head = (j + 1) % KEP_N; if (kepTrail.n < KEP_N) kepTrail.n++;
    } else if (kepTrail.n) { kepTrail.n = 0; kepTrail.head = 0; kepTrail.plane = -1; }
  }
  fpsWin.n++; const now = performance.now();
  if (now - fpsWin.t0 > 1000) { fpsWin.fps = fpsWin.n * 1000 / (now - fpsWin.t0); fpsWin.t0 = now; fpsWin.n = 0; }
}

/* ── axis selector ──────────────────────────────────────────────────── */
function buildAxisButtons() {
  const n = tel ? tel.n : (space ? space.n : 4), box = $('axes'); box.innerHTML = '';
  for (let a = 0; a < n; a++) for (let b = a + 1; b < n; b++) {
    const btn = document.createElement('button'); btn.textContent = a + '×' + b;
    btn.classList.toggle('on', axes[0] === a && axes[1] === b);
    btn.onclick = () => { axes = [a, b]; trail.n = 0; trail.head = 0; buildAxisButtons(); };
    box.appendChild(btn);
  }
}
buildAxisButtons();
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const n = tel ? tel.n : 4, pairs = []; for (let a = 0; a < n; a++) for (let b = a + 1; b < n; b++) pairs.push([a, b]);
  const i = pairs.findIndex(p => p[0] === axes[0] && p[1] === axes[1]);
  if (e.key === 'ArrowRight' || e.key === ']') { axes = pairs[(i + 1) % pairs.length]; trail.n = 0; buildAxisButtons(); }
  if (e.key === 'ArrowLeft' || e.key === '[') { axes = pairs[(i - 1 + pairs.length) % pairs.length]; trail.n = 0; buildAxisButtons(); }
});

/* ── drawing ────────────────────────────────────────────────────────── */
const cs = $('space'), cx = cs.getContext('2d'), cn = $('sound'), cnx = cn.getContext('2d');
function resize() {
  for (const c of [cs, cn]) {
    const r = c.parentElement.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    c.width = Math.max(1, Math.round(r.width * dpr)); c.height = Math.max(1, Math.round(r.height * dpr));
    c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  }
}
window.addEventListener('resize', resize); resize();

const hueOf = pl => Math.round(220 - (pl ? pl[0] : 0.5) * 220);   /* cutoff: blue → yellow/red */
const sizeOf = pl => 4 + (pl ? pl[3] : 0.3) * 10;                    /* drive */

/* ── terrain ────────────────────────────────────────────────────────────
 * With the world as a formula rather than a table, the page can evaluate the
 * whole projection plane and shade it, instead of drawing dots wherever the
 * module happened to sample. Dark to warm, one hue, kept under the dots.  */
const RAMP = (() => {
  const stops = [[0, [10, 15, 22]], [0.30, [44, 33, 35]], [0.58, [98, 61, 38]],
                 [0.82, [168, 108, 53]], [1, [232, 178, 108]]];
  const lut = new Uint8Array(256 * 3);
  for (let i = 0; i < 256; i++) {
    const t = i / 255; let a = stops[0], b = stops[stops.length - 1];
    for (let s = 0; s < stops.length - 1; s++) if (t >= stops[s][0] && t <= stops[s + 1][0]) { a = stops[s]; b = stops[s + 1]; break; }
    const u = (b[0] - a[0]) > 0 ? (t - a[0]) / (b[0] - a[0]) : 0;
    for (let c = 0; c < 3; c++) lut[i * 3 + c] = Math.round(a[1][c] + (b[1][c] - a[1][c]) * u);
  }
  return lut;
})();
/* Rebuild only when the world, the projection, the off-plane position or the
 * shading changes — never per frame. A 72² grid over 64 harmonics is about a
 * million multiply-adds, which is fine occasionally and not at 60 Hz. */
function terrainKey() {
  if (!basis || !tel) return '';
  let off = '';
  for (let a = 0; a < basis.n; a++) if (a !== axes[0] && a !== axes[1]) off += Math.round(clamp01(tel.posL[a]) * 40) + ',';
  /* sharp is part of the key: it changes what the lattice, vertex, Lock and
     Table worlds evaluate to, so a Morph move is a different field. */
  return `${basisWorld}|${axes[0]}|${axes[1]}|${shadeIdx}|${terrain.res}|${off}|${Math.round((tel.sharp || 0) * 40)}`;
}
function buildTerrain() {
  if (!basis || !tel) return;
  const key = terrainKey();
  if (!key || key === terrain.key) return;
  const now = performance.now();
  if (now - terrain.at < 150) return;
  terrain.at = now; terrain.key = key;
  const { n, k } = basis;
  const R = terrain.res, ax = axes[0], ay = axes[1];
  if (ax >= n || ay >= n) return;
  const vals = new Float32Array(R * R), hiStart = k >> 2;
  let lo = Infinity, hi = -Infinity;
  /* One shading measure out of one spectrum. Every measure is a ratio, so
   * the missing normalisation cancels and neither backend has to do it. */
  const shadeOf = (m) => {
    let s = 0, s2 = 0, kw = 0, hf = 0;
    for (let i = 0; i < k; i++) {
      /* magnitude, not the signed coefficient. The sine-phase worlds return
         signed spectra — a triangle's partials alternate — and summing them
         signed computes a different quantity from the firmware's own
         flatness, which sums magnitudes (Finish, core/kyk_world.h). The two
         drifted apart on exactly the worlds where the sign pattern carries
         the waveform. */
      const v = m[i] < 0 ? -m[i] : m[i], p2 = v * v;
      s += v; s2 += p2; kw += (i + 1) * p2;
      if (i >= hiStart) hf += p2;
    }
    if (!(s2 > 0)) return 0;
    return shadeIdx === 0 ? (kw / s2 - 1) / (k - 1)

  for (let a = 0; a < n; a++) row('axis ' + a, -0.2, 1.2, 0.001, () => ctl.c[a], v => ctl.c[a] = v, v => v.toFixed(3));
  h('ROTATION (turns)');
  for (let p = 0; p < planes; p++) { const [x, y] = MVL.planeAxes(n, p); row('plane ' + x + y, 0, 1, 0.001, () => ctl.ang[p], v => ctl.ang[p] = v, v => v.toFixed(3)); }
  h('STEREO');
  row('spread', 0, 0.12, 0.0005, () => ctl.spread, v => ctl.spread = v, v => v.toFixed(4));
  d.classList.add('show'); resize();
}

/* auto-connect to the bridge when served from it */
/* Auto-connect to the bridge when the page came from it — unless ?serial is
 * in the URL, which keeps the link free for the module (the Serial button is
 * hidden while any transport is connected). */
if (!/[?&]serial\b/.test(location.search)
    && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)
    && location.protocol.startsWith('http')) connectBridge(false);
if (!navigator.serial) $('btnSerial').title = 'Web Serial: Chrome/Edge desktop only';
})();
</script>
</body>
